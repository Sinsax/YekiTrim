# Cargo 配置 —— 提交入库，团队共享。
#
# [alias] xtask
# ------------
# `cargo xtask <cmd>` = `cargo run -p xtask -- <cmd>`。仓库任务都在 crates/xtask 里：
#
#     cargo xtask scan                 # 产物门禁：二进制里不能有 espeak-ng
#     cargo xtask package              # 构建 + 门禁 + 组装 + 打 zip
#     cargo xtask package --smoke-test # 再启一次打包好的 exe，验 /api/health 与 WebUI
#
# 这里**刻意不再注入 SHERPA_ONNX_ARCHIVE_DIR**。sherpa-onnx 的预编译库由 vendor 的
# sherpa-onnx-sys/build.rs 自己取（sha256 钉死 + 校验占位库），不需要、也不该靠环境变量：
# 环境变量只在当前 shell 生效，换个终端就静默退回官方 GPL 归档。见
# vendor/sherpa-onnx-sys/FORK-NOTES.md。

[alias]
xtask = "run -p xtask --"

# [alias] cover
# -------------
# 带**静态封面渲染**（Takumi）的构建/运行。`cover-takumi` 是**可选 feature、默认关**，理由写在
# `crates/yekitrim-polish/Cargo.toml`：① 拉长每次构建（takumi + parley/harfrust/ICU4X 一大串）
# ② 带出 libwebp-sys 的 `LNK4098` 链接器警告（默认构建没有）③ 发行产物的许可面要跟着复核。
# 用这个别名就不必每次手打长串（**分隔符由你输入的 `--` 提供**，别名里不能再带一个 ——
# 带了会被当成 exe 的第一个参数，实测 `cargo cover -- polish cover --help` 会变成
# `yekitrim.exe -- polish cover --help` 并报 `unexpected argument 'polish'`）：
#
#     cargo cover -- server                                  # 带 Takumi 通道起服务（封面设计器弹窗里可选）
#     cargo cover -- polish cover <工程目录> --renderer takumi
cover = "run --bin yekitrim --features yekitrim-polish/cover-takumi"
