[package]
name = "vtrim-render-core"
version = "0.1.0"
edition = "2024"
description = "V-Trim 渲染核心：时间线数学 + wgpu 合成管线（桌面/ WASM 共用，不依赖 vtrim-core/vtrim-polish/tokio）"
authors = ["Sinsax"]
license = "GPL-3.0-or-later"

[lib]
name = "vtrim_render_core"
path = "src/lib.rs"

[features]
default = []
# wgpu 合成管线（桌面 native 渲染与 wasm 渲染都启用）
wgpu = ["dep:wgpu", "dep:bytemuck", "dep:swash"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tracing = "0.1"

# 仅 wgpu feature 需要（桌面与 wasm32 均可编译）
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg"] }
wgpu = { version = "27", optional = true }
bytemuck = { version = "1", optional = true }
# 文字光栅化（swash：纯 Rust，wasm 可用）
swash = { version = "0.1", optional = true }
