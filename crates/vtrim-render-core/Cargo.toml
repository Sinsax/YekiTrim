[package]
name = "vtrim-render-core"
version.workspace = true
edition = "2024"
description = "V-Trim 渲染核心：事件/时间线类型与时间线数学（被 vtrim-polish 用，不依赖 vtrim-core/vtrim-polish/tokio）"
authors = ["Sinsax"]
license = "Apache-2.0"

[lib]
name = "vtrim_render_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
