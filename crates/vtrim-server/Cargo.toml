[package]
name = "vtrim-server"
version.workspace = true
edition = "2021"
description = "V-Trim 服务端：axum HTTP API + WebUI 宿主 + 任务队列（被 vtrim 二进制嵌入）"
authors = ["Sinsax"]
license = "Apache-2.0"

[lib]
name = "vtrim_server"
path = "src/lib.rs"

[features]
# ⚠️ 这里曾经有 `wgpu-render = ["vtrim-polish/wgpu-render"]`（wgpu 单帧真渲染预览 + GPU 出片）。
# **整条已删除**（用户拍板：GPU 那侧交给独立的 Dhampir 底座，见根卡）。`/api/health` 不再有
# `wgpu_render` 这一位。别再把 feature 加回来。

[dependencies]
vtrim-core = { path = "../vtrim-core" }
vtrim-polish = { path = "../vtrim-polish" }
vtrim-service = { path = "../vtrim-service" }

axum = "0.7"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"
subtle = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
# 路由单测（oneshot 调用 Router）
tower = { version = "0.5", features = ["util"] }
