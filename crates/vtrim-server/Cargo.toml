[package]
name = "vtrim-server"
version.workspace = true
edition = "2021"
description = "V-Trim 服务端：axum HTTP API + WebUI 宿主 + 任务队列（被 vtrim 二进制嵌入）"
authors = ["Sinsax"]
license = "Apache-2.0"

[lib]
name = "vtrim_server"
path = "src/lib.rs"

[features]
# 启用后服务端包含 wgpu 原生渲染后端（单帧真渲染预览 + VTEDIT_RENDERER=wgpu 出片）。
#
# ⚠️ `cargo build --features wgpu-render` 只写这一个 feature 是**不够的**：
# `#[cfg(feature = "wgpu-render")]` 的 8 处使用全在本 crate（`api.rs` ×3、`model.rs` ×5）。
# feature 随 crate 走，所以 `vtrim-cli` 必须把它**转发**过来（见 cli 清单里的同名 feature）。
# 漏掉转发不会报错，只会让 `/api/health` 的 `wgpu_render` 报 false、GPU 后端静默不编译进去。
wgpu-render = ["vtrim-polish/wgpu-render"]

[dependencies]
vtrim-core = { path = "../vtrim-core" }
vtrim-polish = { path = "../vtrim-polish" }
vtrim-service = { path = "../vtrim-service" }

axum = "0.7"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"
subtle = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
# 路由单测（oneshot 调用 Router）
tower = { version = "0.5", features = ["util"] }
