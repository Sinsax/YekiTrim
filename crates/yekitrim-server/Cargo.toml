[package]
name = "yekitrim-server"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "YekiTrim 服务端：axum HTTP API + WebUI 宿主 + 任务队列（被 yekitrim 二进制嵌入）"
authors = ["Sinsax"]
license = "Apache-2.0"

[lib]
name = "yekitrim_server"
path = "src/lib.rs"

[features]
# ⚠️ 这里曾经有 `wgpu-render = ["yekitrim-polish/wgpu-render"]`（wgpu 单帧真渲染预览 + GPU 出片）。
# **整条已删除**（用户拍板：GPU 那侧交给独立的 Dhampir 底座，见根卡）。`/api/health` 不再有
# `wgpu_render` 这一位。别再把 feature 加回来。

# **封面静态渲染（Takumi）的转发开关**（整改 T12，2026-11-24）。
# 默认仍**不带**（理由与 CLI 侧那三条一样：拉长构建、Windows 上 libwebp-sys 的 LNK4098、发行产物许可面要重核）。
# 不带它的后果是：`yekitrim-polish` 的 `render/takumi.rs`（约 1.1k 行）与 `tests/takumi_font_id.rs`
# 在 `cargo test -p yekitrim-server` / `cargo check --workspace --all-targets` 下**整份不参与编译**，
# 而它正是 WebUI「生成封面」的后端 ⇒ `/api/health.cover_static.compiled` 在 server 语境**恒 false**，
# 谁也不知道那一半还能不能编过。打开方式：`cargo check -p yekitrim-server --features cover-takumi`。
cover-takumi = ["yekitrim-polish/cover-takumi"]

[dependencies]
yekitrim-llm = { path = "../yekitrim-llm" }
yekitrim-core = { path = "../yekitrim-core" }
yekitrim-polish = { path = "../yekitrim-polish" }
yekitrim-service = { path = "../yekitrim-service" }

axum = "0.7"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"
# Dhampir 首屏提速：wasm 响应 gzip（`media.rs::gzip_bytes`）。
# 只服务端压、只压文本类（见 `compressible_mime`），视频那条路不碰。
flate2 = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
# 出片回传：调 biliLive-tools 的 HTTP API（preset / upload / task）。
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
# 路由单测（oneshot 调用 Router）
tower = { version = "0.5", features = ["util"] }
# `tokio::time::pause()` / `#[tokio::test(start_paused = true)]`（每日维护的跳数单测）。
# ⚠️ `full` **不**包含 `test-util`，它只给测试用，别加到上面普通依赖那一行。
tokio = { version = "1", features = ["full", "test-util"] }
