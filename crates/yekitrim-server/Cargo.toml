[package]
name = "yekitrim-server"
version.workspace = true
edition = "2021"
description = "YekiTrim 服务端：axum HTTP API + WebUI 宿主 + 任务队列（被 yekitrim 二进制嵌入）"
authors = ["Sinsax"]
license = "Apache-2.0"

[lib]
name = "yekitrim_server"
path = "src/lib.rs"

[features]
# ⚠️ 这里曾经有 `wgpu-render = ["yekitrim-polish/wgpu-render"]`（wgpu 单帧真渲染预览 + GPU 出片）。
# **整条已删除**（用户拍板：GPU 那侧交给独立的 Dhampir 底座，见根卡）。`/api/health` 不再有
# `wgpu_render` 这一位。别再把 feature 加回来。

[dependencies]
yekitrim-llm = { path = "../yekitrim-llm" }
yekitrim-core = { path = "../yekitrim-core" }
yekitrim-polish = { path = "../yekitrim-polish" }
yekitrim-service = { path = "../yekitrim-service" }

axum = "0.7"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"
# Dhampir 首屏提速：wasm 响应 gzip（`media.rs::gzip_bytes`）。
# 只服务端压、只压文本类（见 `compressible_mime`），视频那条路不碰。
flate2 = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
# 出片回传：调 biliLive-tools 的 HTTP API（preset / upload / task）。
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
# 路由单测（oneshot 调用 Router）
tower = { version = "0.5", features = ["util"] }
# `tokio::time::pause()` / `#[tokio::test(start_paused = true)]`（每日维护的跳数单测）。
# ⚠️ `full` **不**包含 `test-util`，它只给测试用，别加到上面普通依赖那一行。
tokio = { version = "1", features = ["full", "test-util"] }
