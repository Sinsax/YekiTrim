[package]
name = "vtrim-core"
version.workspace = true
edition = "2021"
description = "V-Trim 核心：管线编排 + ASR / 事件检测 / 剪切全部业务逻辑"
authors = ["Sinsax"]
license = "Apache-2.0"

[dependencies]
sherpa-onnx = "1.13.3"
# VAD 走 C API：`sherpa-onnx` 1.13.3 的 Rust 侧 `vad` 模块是私有的（上游 1.13.6 才公开），
# 而本仓库本来就把 sys 换成 vendor/sherpa-onnx-sys（为了不带 GPL 的 espeak-ng），
# 直接用那份绑定最省事，也不必动依赖版本（动版本要连带重验 fork 的 pin 与哈希）。
sherpa-onnx-sys = "1.13.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
which = "7"
tar = "0.4"
bzip2 = "0.5"
indicatif = "0.18"
memmap2 = "0.9"
regex-lite = "0.1"
# 自带字体（`fonts::BUILTIN_FONTS`）的下载校验：清单里钉死 sha256，下完当场比对。
# 与 `vtrim-service` 那条 yt-dlp 供应链同一条规矩（字体文件是解析器要读的**内容载体**）。
sha2 = "0.10"
