[package]
name = "vtrim-core"
version = "0.1.0"
edition = "2021"

[dependencies]
sherpa-onnx = "1.13.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
which = "7"
tar = "0.4"
bzip2 = "0.5"
indicatif = "0.18"
memmap2 = "0.9"
regex-lite = "0.1"
