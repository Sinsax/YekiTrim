<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V-TRIM · 切片管理台</title>
<style>
:root{--bg:#FFF7F3;--bg-soft:#FFEFE7;--card:#fff;--line:#F2E1D9;--line-soft:#FAEEE7;--ink:#4A3F45;--ink-dim:#9C8B92;--ink-faint:#C9B8BE;--main:#F682B8;--main-deep:#EE6FA6;--main-soft:#FDE3EC;--main-glow:#FFD3E1;--blue:#7FA8F0;--blue-soft:#E8EEFC;--mint:#59C0AC;--mint-soft:#E2F6F1;--amber:#F2B23E;--amber-soft:#FCF0D9;--green:#4FBF9C;--green-soft:#DEF2EA;--red:#E8727E;--red-soft:#FBE3E5;--r:16px;--shadow:0 8px 26px rgba(238,111,166,.10),0 2px 6px rgba(90,60,70,.04);--shadow-hover:0 12px 34px rgba(238,111,166,.18),0 3px 8px rgba(90,60,70,.05);--font:'LXGW WenKai','Noto Sans SC','Microsoft YaHei',sans-serif;--mono:'Consolas','Courier New',monospace}
*{margin:0;padding:0;box-sizing:border-box;font-family:var(--font)}
body{background:var(--bg);color:var(--ink);min-height:100vh;font-size:13px;line-height:1.6}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(rgba(246,130,184,.10) 1.5px,transparent 1.6px);background-size:26px 26px}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 20px;background:rgba(255,247,243,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}.brand-logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--main),#FBB9D4);display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;box-shadow:0 4px 12px rgba(238,111,166,.4)}.brand-name{font-size:15px;font-weight:700;color:#E86FA5;line-height:1.2}.brand-sub{font-size:9px;color:var(--ink-faint);letter-spacing:.1em}
.nav-pills{display:flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 2px 10px rgba(90,60,70,.05);flex-wrap:wrap}.nav-pill{padding:6px 15px;border-radius:999px;font-size:13px;color:var(--ink-dim);cursor:pointer;text-decoration:none}.nav-pill:hover{background:var(--bg-soft);color:var(--ink)}.nav-pill.active{background:linear-gradient(135deg,var(--main),var(--main-deep));color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(238,111,166,.35)}
.top-actions{display:flex;gap:8px;align-items:center;margin-left:auto}.bell{position:relative;width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-decoration:none}.bell i{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--bg);display:none}.bell.has i{display:block}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#A9C2F6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.wrap{max-width:1360px;margin:0 auto;padding:20px 20px 80px;position:relative;z-index:1}.page-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}.page-head h1{font-size:22px;font-weight:700}.page-head .sub{font-size:12px;color:var(--ink-dim);margin-top:2px}.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.section-title{font-size:16px;font-weight:700;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;text-decoration:none;box-shadow:0 1px 5px rgba(90,60,70,.04);transition:all .15s}.btn:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px)}.btn-primary{background:linear-gradient(135deg,var(--main),var(--main-deep));color:#fff;border:none;box-shadow:0 4px 14px rgba(238,111,166,.4)}.mini-btn{padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--ink-dim);cursor:pointer;text-decoration:none;transition:all .15s}.mini-btn:hover{border-color:var(--main);color:var(--main-deep);background:var(--main-soft)}.mini-btn.selected{background:var(--green-soft);color:#2FA07E;border-color:var(--green);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px}.chip.g{background:var(--green-soft);color:#2FA07E}.chip.p{background:var(--main-soft);color:#D8669B}.chip.b{background:var(--blue-soft);color:#5E7FD8}.chip.n{background:var(--bg-soft);color:var(--ink-dim)}.chip.r{background:var(--red-soft);color:var(--red)}.chips{display:flex;gap:5px;flex-wrap:wrap}
.sticker{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;transform:rotate(-5deg);box-shadow:0 3px 8px rgba(90,60,70,.08);flex:none}.sticker.pink{background:var(--main-soft);border:2px dashed var(--main)}.sticker.blue{background:var(--blue-soft);border:2px dashed var(--blue)}.sticker.mint{background:var(--mint-soft);border:2px dashed var(--mint)}.sticker.amber{background:var(--amber-soft);border:2px dashed var(--amber)}
.grid{display:grid;gap:12px}.cols-4{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.cols-3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.cols-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}.card h2{font-size:15px;margin-bottom:10px}
.pcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);transition:all .18s;cursor:pointer;overflow:hidden}.pcard:hover{box-shadow:var(--shadow-hover);transform:translateY(-3px)}.pcard.active{border-color:var(--main);box-shadow:0 0 0 2px var(--main-soft),var(--shadow)}.pcard.dim{opacity:.35;filter:grayscale(.6)}.pcard .ribbon{position:absolute;top:14px;right:-32px;transform:rotate(38deg);background:var(--main-soft);color:var(--main-deep);font-size:10px;font-weight:700;padding:3px 38px}.pcard .head{display:flex;gap:12px;align-items:flex-start}.pcard .head>div{min-width:0}.pcard h3{font-size:15px;font-weight:700;line-height:1.35;word-break:break-word;white-space:normal;overflow-wrap:anywhere}.pcard .path{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;align-items:center;gap:4px;margin:10px 0 4px}.steps .dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:0 0 20px}.steps .dot.done{background:var(--green-soft);color:var(--green)}.steps .dot.now{background:var(--main);color:#fff;box-shadow:0 0 0 3px var(--main-soft)}.steps .dot.wait{background:var(--card);border:2px dashed var(--ink-faint);color:var(--ink-faint)}.steps .sl{flex:1;height:5px;border-radius:3px;background:var(--line-soft)}.steps .sl.on{background:var(--main-glow)}
.foot{display:flex;align-items:center;gap:6px;border-top:1px dashed var(--line-soft);padding-top:10px;margin-top:8px}.foot .name{margin-right:auto;font-size:11px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subnav{display:flex;gap:6px;margin:0;padding:0;flex-wrap:wrap;align-items:center}.tab-btn{padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-dim);font-size:13px;cursor:pointer;text-decoration:none}.tab-btn:hover{background:var(--bg-soft);color:var(--ink)}.tab-btn.active{background:linear-gradient(135deg,var(--main),var(--main-deep));color:#fff;border:none;font-weight:600}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spread{justify-content:space-between}.muted{color:var(--ink-dim)}.faint{color:var(--ink-faint)}.small{font-size:12px}.mono{font-family:var(--mono)}.dash{border-top:1px dashed var(--line-soft);margin:10px 0}
video{max-width:100%;max-height:170px;background:#000;border-radius:10px;margin-top:6px}iframe.preview{width:100%;height:75vh;border:0;border-radius:12px;background:#000}input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px;color:var(--ink);outline:none}input:focus,textarea:focus,select:focus{border-color:var(--main)}label{font-size:12px;color:var(--ink-dim);display:block;margin-bottom:4px}
.details-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;background:var(--card)}.details-card summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}.details-card[open]{background:var(--bg-soft)}.evbody{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-soft)}.progress{height:8px;border-radius:99px;background:var(--line-soft);overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--main),#FBB9D4);width:0%;transition:width .2s}
.modal-backdrop{position:fixed;inset:0;background:rgba(90,60,70,.35);display:flex;align-items:center;justify-content:center;z-index:80}.modal{background:var(--card);border-radius:var(--r);padding:20px;width:min(94vw,760px);max-height:92vh;overflow:auto;box-shadow:var(--shadow-hover)}#toast-wrap{position:fixed;top:18px;right:18px;z-index:100;display:flex;flex-direction:column;gap:8px}.toast{padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}.toast.ok{border-color:var(--green);color:#2FA07E}.toast.err{border-color:var(--red);color:var(--red)}
.current-project{color:var(--main-deep);font-weight:600;font-size:13px;margin:0 6px}

.current-project{display:inline-block;color:var(--main-deep);font-weight:600;font-size:13px;margin:0 6px;white-space:nowrap}

/* Polish preview native page */
.polish-editor .page-head{background:linear-gradient(135deg,#fff,var(--bg-soft));border:1px solid var(--line);border-radius:18px;padding:14px 18px;box-shadow:var(--shadow)}
.polish-editor #polishFrame{position:relative;width:100%;aspect-ratio:16/9;max-height:64vh;background:#111;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.polish-editor #polishFrame iframe.preview{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:14px;background:#000}
.polish-editor .card h2{display:flex;align-items:center;gap:6px}
.polish-editor .card h2 .muted{font-size:11px}
.polish-editor #layoutControls > div{margin-top:2px}
.polish-editor #layoutControls [data-key]{transition:all .12s}
.polish-editor #layoutControls [data-key]:hover{transform:translateY(-1px);border-color:var(--main)}
/* ============================================================
   在线编辑器
   ============================================================ */
#editor-panel { position:fixed; left:0; right:0; bottom:0; height:min(46vh,380px); background:#151515; border-top:1px solid #333; z-index:100; display:none; flex-direction:column; box-shadow:0 -8px 30px rgba(0,0,0,0.55); }
#editor-panel.open { display:flex; }
.editor-toolbar { display:flex; align-items:center; gap:8px; padding:6px 12px; background:#1e1e1e; border-bottom:1px solid #333; font-size:13px; color:#eee; flex:0 0 auto; }
.editor-toolbar .ed-title { font-weight:700; margin-right:auto; }
.editor-toolbar button { background:#2a2a2a; border:1px solid #444; color:#eee; font-size:12px; padding:4px 10px; border-radius:4px; cursor:pointer; }
.editor-toolbar button:hover { background:#3a3a3a; }
.editor-toolbar button.primary { background:#2563eb; border-color:#3b82f6; }
#editor-body { flex:1; display:flex; min-height:0; }
#editor-sidebar { width:280px; flex:0 0 280px; border-right:1px solid #333; padding:10px; overflow-y:auto; background:#1a1a1a; color:#ddd; font-size:13px; transition:width 0.2s ease, flex-basis 0.2s ease, padding 0.2s ease; }
#editor-sidebar.collapsed { width:32px; flex-basis:32px; padding:10px 4px; overflow:hidden; }
#editor-sidebar.collapsed .editor-sidebar-head h4,
#editor-sidebar.collapsed #editor-props,
#editor-sidebar.collapsed #editor-props-empty { display:none; }
.editor-sidebar-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.editor-sidebar-head h4 { margin:0; font-size:14px; color:#fff; }
.editor-sidebar-head button { background:#2a2a2a; border:1px solid #444; color:#eee; font-size:12px; padding:2px 8px; border-radius:4px; cursor:pointer; }
.editor-sidebar-head button:hover { background:#3a3a3a; }
#editor-sidebar label { display:block; margin-bottom:8px; font-size:12px; color:#aaa; }
#editor-sidebar input[type=number], #editor-sidebar textarea, #editor-sidebar input[type=text] { width:100%; margin-top:3px; background:#111; border:1px solid #333; color:#eee; border-radius:4px; padding:5px 6px; font-family:monospace; font-size:12px; box-sizing:border-box; }
#editor-sidebar textarea { resize:vertical; min-height:120px; }
#editor-sidebar .ed-buttons { display:flex; gap:6px; margin-top:4px; flex-wrap:wrap; }
#editor-sidebar .ed-buttons button { flex:1; min-width:70px; background:#2a2a2a; border:1px solid #444; color:#eee; font-size:12px; padding:5px 6px; border-radius:4px; cursor:pointer; }
#editor-sidebar .ed-buttons button.danger { background:#7f1d1d; border-color:#b91c1c; }
#editor-sidebar .ed-empty { color:#777; font-size:12px; padding:10px 0; }
#editor-timeline { flex:1; display:flex; flex-direction:row; min-width:0; }
#editor-left-col { width:120px; flex:0 0 120px; border-right:1px solid #333; background:#1e1e1e; overflow:hidden; display:flex; flex-direction:column; z-index:3; }
#editor-left-col .left-ruler-space { height:22px; flex:0 0 22px; background:#111; border-bottom:1px solid #333; }
#editor-left-col .left-lane { height:34px; flex:0 0 34px; display:flex; align-items:center; justify-content:space-between; padding:0 6px 0 10px; border-bottom:1px solid #222; font-size:12px; color:#ccc; }
#editor-left-col .left-lane .ed-add { background:none; border:none; color:#888; cursor:pointer; font-size:14px; line-height:1; padding:2px 4px; }
#editor-left-col .left-lane .ed-add:hover { color:#fff; }
#editor-right { flex:1; display:flex; flex-direction:column; min-width:0; }
#editor-ruler-scroll { overflow-x:hidden; overflow-y:hidden; border-bottom:1px solid #333; scrollbar-gutter:stable; }
#editor-ruler { position:relative; height:22px; background:#111; cursor:pointer; min-width:100%; }
#editor-ruler span { position:absolute; top:4px; font-size:10px; color:#999; transform:translateX(-50%); pointer-events:none; }
#editor-lanes-scroll { flex:1; overflow:auto; position:relative; background:#181818; scrollbar-gutter:stable; }
#editor-lanes { position:relative; width:max-content; min-width:100%; }
.editor-lane { display:flex; height:34px; border-bottom:1px solid #222; position:relative; }
.editor-lane-track { flex:0 0 auto; position:relative; min-width:0; width:100%; }
.ed-block { position:absolute; top:5px; height:24px; background:#3b82f6; border-radius:4px; color:#fff; font-size:11px; line-height:24px; padding:0 6px; white-space:nowrap; overflow:hidden; cursor:grab; user-select:none; z-index:1; box-sizing:border-box; touch-action:none; }
.ed-block:active { cursor:grabbing; }
.ed-block.type-segments { background:#525252; }
.ed-block.type-camera { background:#2563eb; }
.ed-block.type-sticker { background:#7c3aed; }
.ed-block.type-shake { background:#dc2626; }
.ed-block.type-flash { background:#d97706; }
.ed-block.type-blur { background:#0891b2; }
.ed-block.type-zoom_bounce { background:#059669; }
.ed-block.type-vignette { background:#4d7c0f; }
.ed-block.type-hue_shift { background:#db2777; }
.ed-block.type-stutter { background:#9333ea; }
.ed-block.type-split { background:#ea580c; }
.ed-block.type-noise { background:#64748b; }
.ed-block.type-pulse { background:#0d9488; }
.ed-block.type-color_shift { background:#c026d3; }
.ed-block.type-overlay { background:#ca8a04; }
.ed-block.type-sfx { background:#6d28d9; }
.ed-block.selected { outline:2px solid #fff; z-index:3; }
.ed-resize { position:absolute; right:0; top:0; width:8px; height:100%; cursor:ew-resize; background:rgba(255,255,255,0.35); border-radius:0 4px 4px 0; }
#editor-playhead { position:absolute; top:0; bottom:0; width:2px; background:#ff6bcb; z-index:5; pointer-events:none; }
#editor-status { color:#9ca3af; font-size:12px; }
/* 纯编辑器嵌入模式：隐藏播放器，编辑器占满可视区 */
body.editor-embed #page{ display:none !important; }
body.editor-embed #editor-panel{ position:static; height:100vh; height:100%; width:100%; display:flex; }
body.editor-embed #editor-body{ min-height:0; }
body.editor-embed #loading-spinner{ display:none !important; }

/* Native timeline inside WebUI */
.native-timeline-shell #editor-panel{ position:relative !important; left:auto !important; right:auto !important; bottom:auto !important; height:420px !important; width:100% !important; box-shadow:none !important; border-radius:12px !important; overflow:hidden !important; z-index:1 !important; }
.native-timeline-shell #editor-panel.open{ display:flex !important; }
.native-timeline-shell #editor-body{ min-height:0 !important; }
.native-timeline-shell #editor-sidebar{ width:230px !important; flex-basis:230px !important; }
/* Sakura 浅色覆盖：时间轴编辑器融入 WebUI 设计 */
.native-timeline-shell #editor-panel{ background:var(--card); color:var(--ink); }
.native-timeline-shell .editor-toolbar{ background:var(--bg-soft); border-bottom:1px solid var(--line); color:var(--ink); }
.native-timeline-shell .editor-toolbar .ed-title{ color:var(--main-deep); }
.native-timeline-shell .editor-toolbar button{ background:var(--card); border:1px solid var(--line); color:var(--ink-dim); }
.native-timeline-shell .editor-toolbar button:hover{ background:var(--main-soft); color:var(--main-deep); }
.native-timeline-shell #editor-sidebar{ background:var(--bg); border-right:1px solid var(--line); color:var(--ink); }
.native-timeline-shell #editor-sidebar label{ color:var(--ink-dim); }
.native-timeline-shell #editor-sidebar input, .native-timeline-shell #editor-sidebar textarea{ background:var(--card); border:1px solid var(--line); color:var(--ink); }
.native-timeline-shell #editor-sidebar .ed-buttons button{ background:var(--card); border:1px solid var(--line); color:var(--ink); }
.native-timeline-shell #editor-sidebar .ed-buttons button:hover{ background:var(--main-soft); }
.native-timeline-shell #editor-sidebar .ed-empty{ color:var(--ink-faint); }
.native-timeline-shell .editor-sidebar-head h4{ color:var(--ink); }
.native-timeline-shell .editor-sidebar-head button{ background:var(--card); border:1px solid var(--line); color:var(--ink-dim); }
.native-timeline-shell #editor-left-col{ background:var(--bg-soft); border-right:1px solid var(--line); }
.native-timeline-shell #editor-left-col .left-ruler-space{ background:var(--bg-soft); border-bottom:1px solid var(--line); }
.native-timeline-shell #editor-left-col .left-lane{ border-bottom:1px solid var(--line-soft); color:var(--ink-dim); }
.native-timeline-shell #editor-left-col .left-lane .ed-add{ color:var(--ink-faint); }
.native-timeline-shell #editor-ruler{ background:var(--bg-soft); border-bottom:1px solid var(--line); }
.native-timeline-shell #editor-ruler span{ color:var(--ink-faint); }
.native-timeline-shell #editor-lanes-scroll{ background:var(--card); }
.native-timeline-shell .editor-lane{ border-bottom:1px solid var(--line-soft); }
.native-timeline-shell #editor-status{ color:var(--ink-dim); }

</style>
</head>
<body>
<div id="toast-wrap"></div>
<header class="topbar"><a class="brand" href="#/home"><div class="brand-logo">V</div><div><div class="brand-name">V-TRIM</div><div class="brand-sub">切片管理台</div></div></a><nav class="nav-pills" id="mainNav"></nav><div id="projectNav" class="subnav"></div><div class="top-actions"><a class="bell" href="#/jobs">🔔<i id="bellDot"></i></a></div></header>
<main class="wrap" id="view"></main>
<div id="nativeTimelineWrap" style="display:none">
<div class="native-timeline-shell">
<div id="editor-panel">
  <div class="editor-toolbar">
    <span class="ed-title">✎ 在线编辑器</span>
    <span id="editor-status">就绪</span>
    <button id="editor-save" class="primary">💾 保存到 polish.toml</button>
    <button id="editor-close">✕ 关闭</button>
  </div>
  <div id="editor-body">
    <div id="editor-sidebar">
      <div class="editor-sidebar-head">
        <h4>事件属性</h4>
        <button id="editor-sidebar-toggle" title="折叠/展开">◀</button>
      </div>
      <div id="editor-props-empty" class="ed-empty">点击时间轴上的色块编辑事件</div>
      <div id="editor-props" style="display:none">
        <label>类型 <input type="text" id="ed-type" readonly></label>
        <label>开始时间 (秒) <input type="number" id="ed-time" step="0.1" min="0"></label>
        <label>持续时长 (秒) <input type="number" id="ed-duration" step="0.1" min="0.1"></label>
        <label>事件 JSON（高级编辑）<textarea id="ed-json" spellcheck="false"></textarea></label>
        <div class="ed-buttons">
          <button id="ed-apply-json">应用 JSON</button>
          <button id="ed-duplicate">复制</button>
          <button id="ed-delete" class="danger">删除</button>
        </div>
      </div>
    </div>
    <div id="editor-timeline">
      <div id="editor-left-col"></div>
      <div id="editor-right">
        <div id="editor-ruler-scroll"><div id="editor-ruler"></div></div>

function coverGradientFromHighlight(hlColor,dir){

  var from='rgba('+nr+','+ng+','+nb+',0.55)';
  var to='rgba('+nr+','+ng+','+nb+',0.15)';

  if(dir==='top') return 'linear-gradient(180deg,'+from+' 0%,'+to+' 50%,transparent 100%)';
  if(dir==='bottom') return 'linear-gradient(0deg,'+from+' 0%,'+to+' 50%,transparent 100%)';
  if(dir==='radial') return 'radial-gradient(ellipse at 30% 50%,'+from+' 0%,'+to+' 60%,transparent 100%)';

function newProjectModal(){npCur='';const m=el('div','modal-backdrop');m.innerHTML=`<div class="modal" style="width:min(94vw,800px)"><h2>新建项目</h2><div class="row"><div style="flex:1"><label>当前目录</label><input id="npPath" value=""><button class="mini-btn" style="margin-top:4px" id="npGo">打开</button></div></div><div id="npFiles" style="max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0"></div><label>视频文件路径</label><input id="npVideo" placeholder="选择或填写 mp4/mkv..."><label>弹幕文件（可选）</label><input id="npDanmaku" placeholder="自动查找同名 .ass"><label>输出目录</label><input id="npOutput" value="./output"><div class="row" style="margin-top:12px"><button class="btn btn-primary" id="npCreate">初始化</button><button class="btn" onclick="this.closest('.modal-backdrop').remove()">取消</button></div></div>`;document.body.appendChild(m);npBrowse('');$('#npGo').onclick=()=>npBrowse($('#npPath').value.trim());$('#npCreate').onclick=async()=>{try{const input=$('#npVideo').value.trim();if(!input)throw new Error('请填写视频路径');await api('/api/project/init',{method:'POST',body:JSON.stringify({input,danmaku:$('#npDanmaku').value.trim()||null,output_dir:$('#npOutput').value.trim()||'./output'})});toast('项目已创建','ok');m.remove();location.hash='#/home'}catch(e){toast(e.message,'err')}}}
function tsObj(sec){sec=Math.max(0,sec||0);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),ss=Math.floor(sec%60),ms=Math.round((sec-Math.floor(sec))*1000);return{h,m,s:ss,ms}}
async function editEvent(ev){const m=el('div','modal-backdrop');m.innerHTML=`<div class="modal"><h2>编辑事件</h2><div class="row"><div style="flex:1"><label>开始秒</label><input id="eeStart" type="number" value="${Math.round(ev.start_sec)}"></div><div style="flex:1"><label>结束秒</label><input id="eeEnd" type="number" value="${Math.round(ev.end_sec)}"></div></div><label>标题</label><input id="eeLabel" value="${esc(ev.label)}"><label>类型</label><select id="eeType">${['gameplay','interaction','qna','reaction','storytelling','music','food','rant','break','outro','chat','eating','irl','ranking','discussion','intro','other'].map(t=>`<option ${t===ev.event_type?'selected':''}>${t}</option>`).join('')}</select><label>摘要</label><textarea id="eeSummary" rows="4">${esc(ev.summary||'')}</textarea><div class="row" style="margin-top:12px"><button class="btn btn-primary" id="eeSave">保存</button><button class="btn" onclick="this.closest('.modal-backdrop').remove()">取消</button></div></div>`;document.body.appendChild(m);$('#eeSave').onclick=async()=>{const s=parseFloat($('#eeStart').value)||0,e=parseFloat($('#eeEnd').value)||0;if(e<=s){toast('结束必须大于开始','err');return}ev.label=$('#eeLabel').value;ev.event_type=$('#eeType').value;ev.summary=$('#eeSummary').value;ev.start=tsObj(s);ev.end=tsObj(e);ev.start_sec=s;ev.end_sec=e;try{await api('/api/data/events',{method:'PUT',body:JSON.stringify({events:state.events})});toast('事件已保存','ok');m.remove();renderClips()}catch(err){toast(err.message,'err')}}}
function playClip(dir){const m=el("div","modal-backdrop");const sep=String.fromCharCode(92);const short=String(dir||"").split(sep).pop()||"片段";m.innerHTML=`<div class="modal" style="width:min(94vw,900px)"><div class="row spread"><strong>${esc(short)}</strong><button class="btn" onclick="this.closest('.modal-backdrop').remove()">关闭</button></div><video controls autoplay style="width:100%;max-height:70vh;background:#000;border-radius:12px"></video></div>`;const v=m.querySelector("video");const url="/api/media/"+encodeURIComponent(String(dir).split(sep).join("/")+"/clip.mp4").replace(/%2F/g,"/")+"?t="+Date.now();v.src=url;m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m)}function thumbUrl(cdir){const parts=String(cdir).split(/[\/]/);const name=(parts.pop()||'').replace('clip-','');if(name)return '/api/data/clips/'+encodeURIComponent(name)+'/thumb';const m2=String(cdir).match(/clip-(\d+)/);return '/api/data/clips/'+(m2?m2[1]:'0')+'/thumb'}

window.addEventListener('hashchange',route);window.addEventListener('load',route);setInterval(()=>{if(state.current==='#/home'||state.current==='#/jobs')refreshJobs()},3000);(function(){try{const es=new EventSource('/api/stream');es.onmessage=()=>refreshJobs()}catch(e){}})();
</script>
<script>

// ============================================================
// 在线编辑器：多轨道时间轴 + 拖拽移动/缩放 + 保存 polish.toml
// ============================================================
(function(){
  var EDITOR = {
    duration: 60,
    scale: 60,
    selected: null,
    playheadTimer: null,
    waitTimer: null,
    dirty: false
  };
  var LANE_DEFS = [
    { type:'segments', label:'分段', duration:true },
    { type:'camera', label:'运镜', duration:true },
    { type:'sticker', label:'贴纸', duration:true },
    { type:'fx', label:'视觉特效', types:['shake','flash','blur','zoom_bounce','vignette','hue_shift','stutter','split','noise','pulse','color_shift'] },
    { type:'overlay', label:'覆盖层', duration:true },
    { type:'sfx', label:'音效' }
  ];
  var DEFAULT_DUR = { camera:1.0, sticker:2.0, overlay:1.5, sfx:0.5 };
  var LABEL_W = 120; // lane 左侧说明标签宽度

  function round1(v){ return Math.round(v*10)/10; }
  function round2(v){ return Math.round(v*100)/100; }
  function getSegments(){ return CFG.segments || []; }
  function getDuration(){ return window.__DURATION || META.duration || CFG.duration || 60; }
  function defaultDuration(type){ return DEFAULT_DUR[type] || 0.4; }
  function laneDuration(ev){
    if(ev.duration != null) return Math.max(0.1, ev.duration);
    return defaultDuration(ev.type);
  }
  function labelFor(ev){
    if(ev.type==='sticker') return ev.keyword || ev.name || '贴纸';
    if(ev.type==='camera') return ev.zoom || '运镜';
    if(ev.type==='sfx') return ev.name || '音效';
    if(ev.type==='overlay') return ev.overlay_type || '覆盖';
    return ev.type;
  }
  function laneEvents(def){
    var out=[];
    var types=def.types || [def.type];
    var segs=getSegments();
    for(var si=0; si<segs.length; si++){
      var seg=segs[si];
      (seg.events||[]).forEach(function(ev,ei){
        if(types.indexOf(ev.type)>=0) out.push({ si:si, ei:ei, ev:ev, seg:seg });
      });
    }
    out.sort(function(a,b){ return a.ev.time - b.ev.time; });
    return out;
  }

  function render(){
    var dur=getDuration();
    EDITOR.duration=dur;
    var totalW=Math.max(dur*EDITOR.scale, 600);
    var lanes=document.getElementById('editor-lanes');
    var ruler=document.getElementById('editor-ruler');
    if(!lanes || !ruler) return;
    lanes.innerHTML='';
    ruler.innerHTML='';
    var leftCol=document.getElementById('editor-left-col');
    if(leftCol) leftCol.innerHTML='';

    // 刻度尺：从 0 开始，不包含左侧标签
    ruler.style.width=totalW+'px';
    for(var t=0; t<=dur+0.001; t+=5){
      var sp=document.createElement('span');
      sp.style.left=(t*EDITOR.scale)+'px';
      sp.textContent=t+'s';
      ruler.appendChild(sp);
    }

    var ph=document.createElement('div');
    ph.id='editor-playhead';
    ph.style.left='0px';
    lanes.appendChild(ph);

    // 左侧标签列顶部占位（对应刻度尺高度）
    if(leftCol){
      var rulerSpace=document.createElement('div');
      rulerSpace.className='left-ruler-space';
      leftCol.appendChild(rulerSpace);
    }

    LANE_DEFS.forEach(function(def){
      // 左侧标签列
      if(leftCol){
        var leftLane=document.createElement('div');
        leftLane.className='left-lane';
        var span=document.createElement('span');
        span.textContent=def.label;
        leftLane.appendChild(span);
        var addBtn=document.createElement('button');
        addBtn.className='ed-add';
        addBtn.textContent='+';
        addBtn.title='添加 '+def.label;
        addBtn.addEventListener('click', function(e){ e.stopPropagation(); addEvent(def.type); });
        leftLane.appendChild(addBtn);
        leftCol.appendChild(leftLane);
      }

      // 右侧事件轨道（不含 label）
      var lane=document.createElement('div');
      lane.className='editor-lane';
      var track=document.createElement('div');
      track.className='editor-lane-track';
      track.style.width=totalW+'px';
      track.dataset.lane=def.type;
      lane.appendChild(track);
      lanes.appendChild(lane);

      if(def.type==='segments'){
        getSegments().forEach(function(seg,si){
          addSegmentBlock(track, { si:si, ei:-1, seg:seg });
        });
      } else {
        laneEvents(def).forEach(function(item){
          addBlock(track, item, def);
        });
      }
    });
    updatePlayhead();
    // 同步刻度尺与事件轨道的滚动位置
    var lsc=document.getElementById('editor-lanes-scroll');
    var rsc=document.getElementById('editor-ruler-scroll');
    if(lsc && rsc) rsc.scrollLeft=lsc.scrollLeft;
  }

  function addBlock(track, item, def){
    var ev=item.ev;
    var el=document.createElement('div');
    el.className='ed-block type-'+(ev.type||'other');
    el.dataset.si=item.si;
    el.dataset.ei=item.ei;
    el.dataset.lane=def.type;
    var dur=laneDuration(ev);
    el.style.left=(ev.time*EDITOR.scale)+'px';
    el.style.width=Math.max(dur*EDITOR.scale, 10)+'px';
    el.textContent=labelFor(ev);
    el.title=ev.type+' @ '+round1(ev.time)+'s';
    if(def.type==='segments'){
      track.appendChild(el);
      return;
    }
    var resize=document.createElement('span');
    resize.className='ed-resize';
    el.appendChild(resize);
    el.addEventListener('pointerdown', function(e){
      if(e.target===resize) startResize(e,item,el);
      else startDrag(e,item,el);
    });
    el.addEventListener('click', function(e){ e.stopPropagation(); select(item,el); });
    track.appendChild(el);
  }

  function addSegmentBlock(track, item){
    var seg=item.seg;
    var el=document.createElement('div');
    el.className='ed-block type-segments';
    el.dataset.si=item.si;
    el.dataset.ei=-1;
    el.dataset.lane='segments';
    el.style.left=(seg.start*EDITOR.scale)+'px';
    el.style.width=Math.max((seg.end-seg.start)*EDITOR.scale, 8)+'px';
    el.textContent=seg.note || ('分段 '+(item.si+1));
    el.title='分段 '+round1(seg.start)+'s ~ '+round1(seg.end)+'s';
    var resize=document.createElement('span');
    resize.className='ed-resize';
    el.appendChild(resize);
    el.addEventListener('pointerdown', function(e){
      if(e.target===resize) startSegmentResize(e,item,el);
      else startSegmentDrag(e,item,el);
    });
    track.appendChild(el);
  }

  function positionSegmentBlock(el,item){
    var seg=item.seg;
    el.style.left=(seg.start*EDITOR.scale)+'px';
    el.style.width=Math.max((seg.end-seg.start)*EDITOR.scale, 8)+'px';
    el.title='分段 '+round1(seg.start)+'s ~ '+round1(seg.end)+'s';
    updatePlayhead();
  }

  function updateSegmentEventBlocks(si, skipEl){
    var seg=getSegments()[si];
    if(!seg) return;
    document.querySelectorAll('.ed-block[data-si="'+si+'"]').forEach(function(b){
      if(b===skipEl) return;
      var ei=parseInt(b.dataset.ei,10);
      if(ei>=0 && seg.events && seg.events[ei]){
        positionBlock(b,{ ev:seg.events[ei] });
      }
    });
  }

  function startSegmentDrag(e,item,el){
    e.preventDefault();
    var startX=e.clientX;
    var startTime=item.seg.start;
    var startEnd=item.seg.end;
    var dur=getDuration();
    var len=startEnd-startTime;
    var origEventTimes=(item.seg.events||[]).map(function(ev){ return ev.time; });
    var moved=false;
    function onMove(ev){
      var dx=ev.clientX-startX;
      var ns=Math.max(0, Math.min(dur-len, startTime+dx/EDITOR.scale));
      ns=round2(ns);
      if(Math.abs(ns-item.seg.start)>0.001){
        moved=true;
        var delta=ns-startTime;
        item.seg.start=ns;
        item.seg.end=round2(startEnd+delta);
        (item.seg.events||[]).forEach(function(ev,i){
          ev.time=round2(Math.min(dur, Math.max(0, origEventTimes[i]+delta)));
        });
        positionSegmentBlock(el,item);
        updateSegmentEventBlocks(item.si, el);
      }
    }
    function onUp(){
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      document.removeEventListener('pointercancel',onUp);
      if(moved){
        markDirty();
        if(EDITOR.selected && EDITOR.selected.si===item.si) fillProps();
      }
    }
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
    document.addEventListener('pointercancel',onUp);
  }

  function startSegmentResize(e,item,el){
    e.preventDefault();
    e.stopPropagation();
    var startX=e.clientX;
    var startEnd=item.seg.end;
    var dur=getDuration();
    var moved=false;
    function onMove(ev){
      var dx=ev.clientX-startX;
      var ne=Math.max(item.seg.start+0.1, Math.min(dur, startEnd+dx/EDITOR.scale));
      ne=round2(ne);
      if(Math.abs(ne-item.seg.end)>0.001){
        moved=true;
        item.seg.end=ne;
        positionSegmentBlock(el,item);
      }
    }
    function onUp(){
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      document.removeEventListener('pointercancel',onUp);
      if(moved) markDirty();
    }
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
    document.addEventListener('pointercancel',onUp);
  }

  function startDrag(e,item,el){
    e.preventDefault();
    var startX=e.clientX;
    var startTime=item.ev.time;
    var dur=getDuration();
    var moved=false;
    function onMove(ev){
      var dx=ev.clientX-startX;
      var nt=Math.max(0, Math.min(dur, startTime+dx/EDITOR.scale));
      nt=round2(nt);
      if(Math.abs(nt-item.ev.time)>0.001){
        moved=true;
        item.ev.time=nt;
        positionBlock(el,item);
      }
    }
    function onUp(){
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      document.removeEventListener('pointercancel',onUp);
      select(item,el);
      if(moved) markDirty();
    }
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
    document.addEventListener('pointercancel',onUp);
  }

  function startResize(e,item,el){
    e.preventDefault();
    e.stopPropagation();
    var startX=e.clientX;
    var startDur=laneDuration(item.ev);
    var dur=getDuration();
    var moved=false;
    function onMove(ev){
      var dx=ev.clientX-startX;
      var nd=Math.max(0.1, startDur+dx/EDITOR.scale);
      nd=Math.min(nd, Math.max(0.1, dur-item.ev.time));
      nd=round2(nd);
      if(Math.abs(nd-(item.ev.duration!=null?item.ev.duration:laneDuration(item.ev)))>0.001){
        moved=true;
        item.ev.duration=nd;
        positionBlock(el,item);
      }
    }
    function onUp(){
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      document.removeEventListener('pointercancel',onUp);
      select(item,el);
      if(moved) markDirty();
    }
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
    document.addEventListener('pointercancel',onUp);
  }

  function positionBlock(el,item){
    var dur=laneDuration(item.ev);
    el.style.left=(item.ev.time*EDITOR.scale)+'px';
    el.style.width=Math.max(dur*EDITOR.scale,10)+'px';
    el.title=item.ev.type+' @ '+round1(item.ev.time)+'s';
    updatePlayhead();
  }

  function select(item,el){
    EDITOR.selected={ si:item.si, ei:item.ei, ev:item.ev };
    var old=document.querySelector('.ed-block.selected');
    if(old) old.classList.remove('selected');
    if(el) el.classList.add('selected');
    // 点击事件时自动展开属性面板
    var sb=document.getElementById('editor-sidebar');
    if(sb && sb.classList.contains('collapsed')){
      sb.classList.remove('collapsed');
      var st=document.getElementById('editor-sidebar-toggle');
      if(st) st.textContent='◀';
    }
    fillProps();
  }

  function fillProps(){
    var sel=EDITOR.selected;
    var wrap=document.getElementById('editor-props');
    var empty=document.getElementById('editor-props-empty');
    if(!wrap || !empty) return;
    if(!sel){
      wrap.style.display='none';
      empty.style.display='block';
      return;
    }
    wrap.style.display='block';
    empty.style.display='none';
    document.getElementById('ed-type').value=sel.ev.type || '';
    document.getElementById('ed-time').value=round2(sel.ev.time);
    document.getElementById('ed-duration').value=round2(laneDuration(sel.ev));
    document.getElementById('ed-json').value=JSON.stringify(sel.ev,null,2);
  }

  function applyTime(){
    var sel=EDITOR.selected;
    if(!sel) return;
    var v=parseFloat(document.getElementById('ed-time').value);
    if(!isNaN(v) && v>=0) sel.ev.time=round2(Math.min(v,getDuration()));
    refreshSelectedBlock();
  }

  function applyDuration(){
    var sel=EDITOR.selected;
    if(!sel) return;
    var d=parseFloat(document.getElementById('ed-duration').value);
    if(!isNaN(d) && d>=0.1) sel.ev.duration=round2(d);
    refreshSelectedBlock();
  }

  function applyJson(){
    var sel=EDITOR.selected;
    if(!sel) return;
    try{
      var obj=JSON.parse(document.getElementById('ed-json').value);
      if(typeof obj!=='object' || obj===null || Array.isArray(obj)) throw new Error('必须是 JSON 对象');
      var segs=getSegments();
      var seg=segs[sel.si];
      if(!seg || !seg.events || !seg.events[sel.ei]) throw new Error('事件已不存在');
      seg.events[sel.ei]=obj;
      EDITOR.selected.ev=obj;
      render();
      var el=document.querySelector('[data-si="'+sel.si+'"][data-ei="'+sel.ei+'"]');
      if(el) select(EDITOR.selected,el);
      markDirty();
    }catch(err){ alert('JSON 错误: '+err.message); }
  }

  function refreshSelectedBlock(){
    var sel=EDITOR.selected;
    if(!sel) return;
    var el=document.querySelector('.ed-block.selected');
    if(el) positionBlock(el,{ ev:sel.ev });
    fillProps();
    markDirty();
  }

  function deleteSelected(){
    var sel=EDITOR.selected;
    if(!sel) return;
    var segs=getSegments();
    var seg=segs[sel.si];
    if(seg && seg.events) seg.events.splice(sel.ei,1);
    EDITOR.selected=null;
    render();
    fillProps();
    markDirty();
  }

  function duplicateSelected(){
    var sel=EDITOR.selected;
    if(!sel) return;
    var copy=JSON.parse(JSON.stringify(sel.ev));
    copy.time=round2((copy.time||0)+0.5);
    var seg=getSegments()[sel.si];
    if(seg && seg.events){
      seg.events.push(copy);
      render();
      markDirty();
    }
  }

  function currentTime(){
    if(window.__polishEditorTime != null) return window.__polishEditorTime;
    return 0;
  }

  function seekTo(t){
    if(t == null) t = 0;
    window.__polishEditorTime = t;
    try{
      var frame=document.getElementById('polishFrame');
      var ifr=frame ? frame.querySelector('iframe') : null;
      if(ifr && ifr.contentWindow){
        ifr.contentWindow.postMessage({ type:'polish-player', cmd:'seek', time:t }, '*');
      }
    }catch(e){}
    updatePlayhead();
  }

  function addEvent(type){
    if(type==='fx') type='shake'; // 视觉特效 lane 默认添加震动
    if(!CFG.segments) CFG.segments=[];
    var segs=CFG.segments;
    var t=round2(currentTime());

    if(type==='segments'){
      var dur=getDuration();
      var start=t;
      var end=Math.min(t+5, dur);
      if(end<=start){
        start=Math.max(0, t-1);
        end=Math.min(dur, start+5);
        if(end<=start) end=Math.min(dur, start+1);
      }
      segs.push({ start:round2(start), end:round2(end), fx:'low', note:'新分段', events:[] });
      render();
      markDirty();
      return;
    }

    if(!segs.length){
      alert('请先添加一个分段');
      return;
    }

    var ev={ type:type, time:t };
    if(type==='sticker'){ ev.duration=2.0; ev.keyword='laugh'; ev.x='50%'; ev.y='50%'; }
    else if(type==='camera'){ ev.duration=3.0; ev.zoom='中'; ev.origin='50% 50%'; }
    else if(type==='overlay'){ ev.duration=1.5; ev.overlay_type='color'; ev.color='rgba(255,50,50,0.3)'; ev.opacity=1.0; }
    else if(type==='sfx'){ ev.name='pop-notice'; ev.volume=0.3; ev.duration=1.0; }
    else if(type==='shake'){ ev.intensity=10; ev.duration=0.3; }
    else if(type==='flash'){ ev.color='#ffffff'; ev.duration=0.5; }
    else if(type==='blur'){ ev.duration=0.8; }
    else if(type==='zoom_bounce'){ ev.duration=0.3; }
    else if(type==='vignette'){ ev.duration=0.9; }
    else if(type==='hue_shift'){ ev.color='#ff0040'; ev.duration=1.0; }
    else if(type==='stutter'){ ev.intensity=12; ev.duration=0.3; }
    else if(type==='split'){ ev.intensity=30; ev.duration=0.4; }
    else if(type==='noise'){ ev.duration=1.0; }
    else if(type==='pulse'){ ev.duration=0.6; }
    else if(type==='color_shift'){ ev.color='#ff0040'; ev.duration=0.8; }

    var target=null;
    for(var i=0;i<segs.length;i++){
      if(t>=segs[i].start && t<segs[i].end){ target=segs[i]; break; }
    }
    if(!target) target=segs[0];
    if(!target.events) target.events=[];
    target.events.push(ev);
    render();
    var si=segs.indexOf(target);
    var ei=target.events.length-1;
    var el=document.querySelector('[data-si="'+si+'"][data-ei="'+ei+'"]');
    if(el) select({ si:si, ei:ei, ev:ev }, el);
    markDirty();
  }

  function markDirty(){
    EDITOR.dirty=true;
    var st=document.getElementById('editor-status');
    if(st){
      st.textContent='有未保存修改';
      st.style.color='#fbbf24';
    }
  }

  function updatePlayhead(){
    var ph=document.getElementById('editor-playhead');
    var t = window.__polishEditorTime != null ? window.__polishEditorTime : 0;
    if(ph){
      ph.style.left=(t*EDITOR.scale)+'px';
    }
  }

  function save(){
    if(!CFG.segments){
      alert('配置中没有 segments，无法保存');
      return;
    }
    var btn=document.getElementById('editor-save');
    btn.disabled=true;
    btn.textContent='保存中...';
    var dir = window.__polishEditorDir || '';
    fetch('/api/polish/project',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ dir: dir, segments: CFG.segments })
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){ return { ok:r.ok, data:d }; });
    }).then(function(res){
      if(res.ok && res.data && res.data.ok){
        EDITOR.dirty=false;
        var st=document.getElementById('editor-status');
        if(st){ st.textContent='已保存，刷新预览...'; st.style.color='#4ade80'; }
        if(typeof window.__polishEditorOnSaved === 'function'){
          try{ window.__polishEditorOnSaved(dir); }catch(e){}
        }
        setTimeout(function(){ EDITOR.dirty=false; }, 200);
      } else {
        alert('保存失败: '+((res.data && res.data.error) || '未知错误'));
        btn.disabled=false;
        btn.textContent='💾 保存到 polish.toml';
      }
    }).catch(function(err){
      alert('保存请求失败: '+err.message);
      btn.disabled=false;
      btn.textContent='💾 保存到 polish.toml';
    });
  }

  function updateEditorLayout(){
    var panel=document.getElementById('editor-panel');
    var h=panel && panel.classList.contains('open') ? panel.offsetHeight : 0;
    document.documentElement.style.setProperty('--editor-h', h+'px');
    document.body.classList.toggle('editor-open', !!(h>0));
    if(window.__updateOverlayScale) window.__updateOverlayScale();
  }

  function toggle(open){
    var panel=document.getElementById('editor-panel');
    if(!panel) return;
    if(open===undefined) open=!panel.classList.contains('open');
    panel.classList.toggle('open', open);
    updateEditorLayout();
    var btn=document.getElementById('btn-editor');
    if(btn) btn.style.color=open ? '#ff6bcb' : '';
    if(EDITOR.waitTimer){
      clearInterval(EDITOR.waitTimer);
      EDITOR.waitTimer=null;
    }
    if(open){
      render();
      var st=document.getElementById('editor-status');
      if(st){
        st.textContent=EDITOR.dirty ? '有未保存修改' : '就绪';
        st.style.color=EDITOR.dirty ? '#fbbf24' : '#9ca3af';
      }
      if(!window.__DURATION){
        var tries=0;
        EDITOR.waitTimer=setInterval(function(){
          tries++;
          if(window.__DURATION || tries>50){
            clearInterval(EDITOR.waitTimer);
            EDITOR.waitTimer=null;
            render();
          }
        },200);
      }
      if(!EDITOR.playheadTimer){
        EDITOR.playheadTimer=setInterval(updatePlayhead,200);
      }
    } else {
      if(EDITOR.waitTimer){
        clearInterval(EDITOR.waitTimer);
        EDITOR.waitTimer=null;
      }
      if(EDITOR.playheadTimer){
        clearInterval(EDITOR.playheadTimer);
        EDITOR.playheadTimer=null;
      }
    }
  }

  function bind(){
    if(EDITOR.bound) return;
    EDITOR.bound=true;
    var btn=document.getElementById('btn-editor');
    if(btn) btn.addEventListener('click', function(){ toggle(); });
    var closeBtn=document.getElementById('editor-close');
    if(closeBtn) closeBtn.addEventListener('click', function(){ toggle(false); });
    document.getElementById('editor-save').addEventListener('click', save);
    var sideToggle=document.getElementById('editor-sidebar-toggle');
    if(sideToggle){
      sideToggle.addEventListener('click', function(){
        var sb=document.getElementById('editor-sidebar');
        var collapsed=sb.classList.toggle('collapsed');
        sideToggle.textContent=collapsed ? '▶' : '◀';
      });
    }
    document.getElementById('ed-time').addEventListener('input', applyTime);
    document.getElementById('ed-duration').addEventListener('input', applyDuration);
    document.getElementById('ed-apply-json').addEventListener('click', applyJson);
    document.getElementById('ed-delete').addEventListener('click', deleteSelected);
    document.getElementById('ed-duplicate').addEventListener('click', duplicateSelected);
    var lanesScroll=document.getElementById('editor-lanes-scroll');
    function trackTimeFromEvent(e, target){
      // 基于具体 track 的视口 rect：滚动后 rect.left 自动反映滚动，无需手动加 scrollLeft
      var rect=target.getBoundingClientRect();
      var x=e.clientX-rect.left;
      return Math.max(0, x/EDITOR.scale);
    }
    var dragSeek=false, dragTarget=null;
    lanesScroll.addEventListener('pointerdown', function(e){
      if(e.target.classList.contains('editor-lane-track')){
        dragSeek=true;
        dragTarget=e.target;
        EDITOR.selected=null;
        var old=document.querySelector('.ed-block.selected');
        if(old) old.classList.remove('selected');
        fillProps();
        seekTo(trackTimeFromEvent(e, dragTarget));
      }
    });
    lanesScroll.addEventListener('pointermove', function(e){
      if(dragSeek && dragTarget){
        seekTo(trackTimeFromEvent(e, dragTarget));
      }
    });
    window.addEventListener('pointerup', function(){ dragSeek=false; dragTarget=null; });
    lanesScroll.addEventListener('click', function(e){
      // 点击空白轨道：清空选中 + 跳转（pointerdown 已处理，这里兜底）
      if(e.target.classList.contains('editor-lane-track')){
        seekTo(trackTimeFromEvent(e, e.target));
      }
    });
    document.getElementById('editor-lanes-scroll').addEventListener('scroll', function(){
      document.getElementById('editor-ruler-scroll').scrollLeft = this.scrollLeft;
    });
    // 点击刻度尺跳转到对应时间（刻度从 0 开始；rect 已反映滚动）
    var rulerEl=document.getElementById('editor-ruler');
    if(rulerEl){
      rulerEl.addEventListener('click', function(e){
        var rect=e.currentTarget.getBoundingClientRect();
        var x=e.clientX-rect.left;
        var t=Math.max(0, x/EDITOR.scale);
        seekTo(t);
      });
    }
    // 滚轮：水平滚动时间轴视图，不移动播放时间
    document.getElementById('editor-lanes-scroll').addEventListener('wheel', function(e){
      e.preventDefault();
      var delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      this.scrollLeft += delta;
    }, { passive:false });
  }

  function init(){
    if(document.readyState==='loading'){
      document.addEventListener('DOMContentLoaded', init);
      return;
    }
    var params = new URLSearchParams(location.search);
    var isPlayerOnly = params.get('player')==='1';
    var isEmbedEditor = params.get('editor')==='1' && params.get('embed')==='1';
    if(isPlayerOnly){
      var edBtn=document.getElementById('btn-editor');
      if(edBtn) edBtn.style.display='none';
      var panel=document.getElementById('editor-panel');
      if(panel) panel.style.display='none';
      document.body.classList.add('player-only');
      window.__playerOnly=true;
      // 暴露给父页面：播放/暂停/seek/获取时间
      window.__polishPlayerControl = {
        play: function(){ var v=document.getElementById('source-video'); if(v && v.paused) v.play(); },
        pause: function(){ var v=document.getElementById('source-video'); if(v && !v.paused) v.pause(); },
        seek: function(t){ var v=document.getElementById('source-video'); if(v && isFinite(t)) v.currentTime=t; },
        getTime: function(){ var v=document.getElementById('source-video'); return v? v.currentTime : 0; }
      };
      return;
    }
    if(isEmbedEditor){
      document.body.classList.add('editor-embed');
      window.__editorEmbed=true;
      bind();
      window.addEventListener('resize', updateEditorLayout);
      updateEditorLayout();
      toggle(true);
      return;
    }
    bind();
    window.addEventListener('resize', updateEditorLayout);
    updateEditorLayout();
    if(new URLSearchParams(location.search).get('editor')==='1'){
      toggle(true);
    }
  }

  // ---- WebUI native API ----
  function nativeOpen(dir, cfg){
    window.__polishEditorDir = dir;
    var c = cfg || {};
    window.CFG = c;
    CFG = c; // free variable resolves to global if declared? ensure local var? CFG not declared inside IIFE; referencing CFG would throw if undefined.
    window.META = window.META || {};
    var lastEnd = 0;
    if(c && c.segments && c.segments.length){ lastEnd = c.segments[c.segments.length-1].end || 0; }
    var dur = (c && c.duration) || lastEnd || 0;
    window.META.duration = dur;
    window.__DURATION = dur;
    window.__polishEditorTime = 0;
    if(!EDITOR.bound){ bind(); }
    var panel=document.getElementById('editor-panel');
    var isOpen = panel && panel.classList.contains('open');
    if(!isOpen){ toggle(true); } else { render(); }
    if(window.__polishEditorTime == null) window.__polishEditorTime = 0;
    updatePlayhead();
  }
  function nativeSave(){
    save();
  }
  window.__polishTimelineAPI = {
    open: nativeOpen,
    save: nativeSave,
    isOpen: function(){ var p=document.getElementById('editor-panel'); return !!(p && p.classList.contains('open')); },
    close: function(){ toggle(false); },
    getCfg: function(){ return CFG; }
  };
})();

</script>
