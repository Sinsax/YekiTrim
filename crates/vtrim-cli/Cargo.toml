[package]
name = "vtrim-cli"
version.workspace = true
edition = "2021"
description = "V-Trim CLI 入口（clap 命令；服务端在 vtrim-server crate，二进制名 vtrim）"
authors = ["Sinsax"]
license = "Apache-2.0"

[[bin]]
name = "vtrim"
path = "src/main.rs"

[dependencies]
vtrim-core = { path = "../vtrim-core" }
vtrim-polish = { path = "../vtrim-polish" }
vtrim-service = { path = "../vtrim-service" }
vtrim-server = { path = "../vtrim-server" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"
anyhow = "1"

[features]
# ⚠️ 这里曾经是 `wgpu-render = ["vtrim-server/wgpu-render"]` 的**转发**（feature 随 crate 走）。
# 那条 GPU 链路已删除（GPU 出片交给独立的 Dhampir 底座），所以这里不再有 feature。
