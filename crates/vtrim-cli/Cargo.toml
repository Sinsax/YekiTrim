[package]
name = "vtrim-cli"
version = "0.1.0"
edition = "2021"
description = "V-Trim CLI 与服务端（clap 命令 + axum WebUI 后端，二进制名 vtrim）"
authors = ["Sinsax"]
license = "GPL-3.0-or-later"

[[bin]]
name = "vtrim"
path = "src/main.rs"

[dependencies]
vtrim-core = { path = "../vtrim-core" }
vtrim-polish = { path = "../vtrim-polish" }
axum = "0.7"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# 录播姬 HTTP API 客户端（房间增删查）。树里已有 reqwest（core/polish 在用）
reqwest = { version = "0.12", features = ["json"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"
anyhow = "1"
base64 = "0.22"
# 多用户服务 P1：账号账本（SQLite，bundled 自带 libsqlite3）
rusqlite = { version = "0.32", features = ["bundled"] }
# 口令 KDF：设计稿原定 argon2id，本次离线环境无 argon2 依赖缓存，改用 scrypt（内存硬）+
# 自描述哈希串，后续可在登录时"重哈希升级"到 argon2id（见 service/auth.rs 顶部说明）
scrypt = { version = "0.11", default-features = false }
subtle = "2"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
# 路由单测（oneshot 调用 Router）
tower = { version = "0.5", features = ["util"] }

[features]
# 启用后 server 二进制包含 wgpu 原生渲染后端（单帧真渲染预览 + VTEDIT_RENDERER=wgpu 出片）
wgpu-render = ["vtrim-polish/wgpu-render"]
