[package]
name = "vtrim-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vtrim"
path = "src/main.rs"

[dependencies]
vtrim-core = { path = "../vtrim-core" }
vtrim-polish = { path = "../vtrim-polish" }
axum = "0.7"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"
anyhow = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
# 路由单测（oneshot 调用 Router）
tower = { version = "0.5", features = ["util"] }

[features]
# 启用后 server 二进制包含 wgpu 原生渲染后端（单帧真渲染预览 + VTEDIT_RENDERER=wgpu 出片）
wgpu-render = ["vtrim-polish/wgpu-render"]
