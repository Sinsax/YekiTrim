[package]
name = "vtrim-cli"
version.workspace = true
edition = "2021"
description = "V-Trim CLI 入口（clap 命令；服务端在 vtrim-server crate，二进制名 vtrim）"
authors = ["Sinsax"]
license = "Apache-2.0"

[[bin]]
name = "vtrim"
path = "src/main.rs"

[dependencies]
vtrim-core = { path = "../vtrim-core" }
vtrim-polish = { path = "../vtrim-polish" }
vtrim-service = { path = "../vtrim-service" }
vtrim-server = { path = "../vtrim-server" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"
anyhow = "1"

[features]
# ⚠️ **转发，不是自己启用**：`#[cfg(feature = "wgpu-render")]` 全在 `vtrim-server`（8 处）。
# 这里必须把 feature 递下去，否则 `cargo build --features wgpu-render` 照样构建成功，
# 但 GPU 后端不会被编译进 server —— `/api/health` 的 `wgpu_render` 报 false、静默退回。
wgpu-render = ["vtrim-server/wgpu-render"]
