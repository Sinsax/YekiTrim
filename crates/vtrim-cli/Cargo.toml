[package]
name = "vtrim-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vtrim"
path = "src/main.rs"

[dependencies]
vtrim-core = { path = "../vtrim-core" }
vtrim-polish = { path = "../vtrim-polish" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
toml_edit = "0.22"
indicatif = "0.18"
serde_json = "1"
