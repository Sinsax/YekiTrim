<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cover</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
/* 字体栈与出片模板 index.html 和应用（webui 的 `--font`）**同一套**：
   以前这里没写 font-family，headless Chrome 就落到它自己的默认字体上 ——
   设计器预览用的是应用字体，于是"设计器里长这样、出片是另一个样"（用户报过）。
   表情特效那种要 emoji 的由 `cover_fx_html` 单独指定字体栈，不受这里影响。
   `__FONT_FAMILY__` = `[cover] font` 选了字体库里的字体时「该字体的 @font-face 名 + 原栈」，
   没选就是原来的系统栈（由 cover.rs 替换）。 */
html,body { width:100%; height:100%; overflow:hidden; background:#000;
  font-family:__FONT_FAMILY__; }
#wrapper { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
/* 封面画布尺寸由 cover.rs 注入（__COVER_W__/__COVER_H__）：**恒横版 1920×1080**，
   不跟随 [canvas] orientation —— 平台封面就是横的；竖屏素材靠下面 #frame 的
   object-fit:contain 保持原比例，画布尺寸本身不动。 */
#page { position:relative; width:__COVER_W__px; height:__COVER_H__px; overflow:hidden; background:#000; flex-shrink:0; transform-origin:center center; }
/* 出片模式（__EXPORT__=true）：不缩放、不居中，页面左上角对齐视口原点，
   配合 CDP 的 clip(0,0,W,H) 拿到干净的整幅封面 —— 否则抓到的是浏览器
   视口尺寸（比画布小），页面被居中 → 成片四周黑边。
   预览模式保持原样（缩放铺满窗口、右下角留刷新按钮）。 */
html.export #wrapper { justify-content:flex-start; align-items:flex-start; }
html.export #page { transform:none; }
html.export #toolbar { display:none; }
/* 背景层（**在帧之下**，用户要求：加的一层，不是替换帧）—— 帧缩小/平移时才露出来。
   三种模式（[cover] bg_mode）：
   color = 纯色（默认，黑）；blur = 当前帧（关键帧）模糊后平铺；image = 导入的自定义背景图。
   blur / image 用的是**各自的文件**：blur 读关键帧 `_cover_frame.jpg`，image 读 `_cover_bg.jpg`
   —— 别让它们共用一个文件，否则导入背景就把「关键帧层」盖掉了（用户报过）。 */
#bg { position:absolute; inset:0; background:var(--bg-color); overflow:hidden; }
#bg img { display:none; }
#bg.bg-blur img, #bg.bg-image img { display:block; width:100%; height:100%; object-fit:cover; }
#bg.bg-blur img { filter:blur(var(--bg-blur)); transform-origin:center center;
  transform:scale(var(--bg-blur-scale)); }
/* 帧层（当前帧清晰图）：可位移/缩放（bg_x/bg_y/bg_zoom + layout.liver 的聚焦原点），
   在背景之上、渐变/暗角/标题之下。别把它并进 #bg —— 那样就又变成"背景替换帧"了。 */
#frame { position:absolute; inset:0; overflow:hidden; }
/* object-fit:contain —— 素材**保持原比例**完整显示（用户要求）：竖屏素材在横版封面上
   左右留边（露出背景层），不再被 cover 裁掉上下。 */
#frame img { width:100%; height:100%; object-fit:contain; display:block;
  transform-origin: var(--liver-x) var(--liver-y);
  transform:var(--bg-transform); }
#overlay { position:absolute; top:0; left:0; bottom:0; right:0; pointer-events:none;
  background:var(--grad-bg); }
#vignette { position:absolute; inset:0; pointer-events:none; opacity:var(--vignette-op);
  background:radial-gradient(ellipse at 55% 45%, transparent 50%, rgba(0,0,0,1) 100%); }
#title-wrap { position:absolute; z-index:2;
  left:var(--text-x); top:var(--text-y);
  transform:translate(-50%,-50%);
  width:var(--tw);
  display:flex; flex-direction:column; align-items:var(--align-items); }
/* 标题**不做自动换行**（用户要求）：每行就是你敲的一行（`title_lines` 用 <br> 断行），
   超宽就溢出、由 `#page{overflow:hidden}` 裁掉 —— 要放进画面请手动断行或缩字号。
   预览侧（`CoverDesigner.vue` 的 `.title-text`）是镜像：`white-space:pre-line` + `width:max-content`。 */
#title { font-size:var(--fs); font-weight:900; color:#f0e6d3; line-height:var(--lh); letter-spacing:var(--ls); text-align:var(--text-align);
  white-space:nowrap;
  /* stroke-linejoin:round —— Takumi 的文本描边吃这条（stylesheets.rs:1275 → text_drawing.rs 的 stroke.join），
     缺省 Miter join 在 CJK 尖笔画上出尖刺（用户报的「描边不准确」）；浏览器侧写同一份保证预览同观感。 */
  stroke-linejoin:round; -webkit-text-stroke:var(--sk) #2a2522; paint-order:stroke fill; text-shadow:var(--text-shadow);
  opacity:0; transform:translateY(24px); animation:fadeUp 0.6s 0.3s ease both; }
.hl { color:var(--hlc); font-size:var(--hl-fs, 1em); stroke-linejoin:round; -webkit-text-stroke:var(--sk) #2a2522; paint-order:stroke fill; }
@keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
</style>
<!-- 图层栈（[cover] layers）的 z-index / display：`cover.rs::cover_layer_css()` 注入，
     **固定的那五块**由它定位；每个特效/表情各带内联 z-index（见 __FX_HTML__）。
     单独一个 <style> 放在主样式之后：同特异度时按文档序覆盖，别合并进上面那一块。 -->
<style>__LAYER_CSS__</style>
<!-- ⚠️ **静态渲染通道（不跑 JS，如 Takumi）也要拿得到这些变量。**
     变量的唯一来源曾经是下面 `<script>` 里的 `setProperty` —— 静态渲染器不执行 JS ⇒ 19 个变量全未定义
     ⇒ 所有 `var(--…)` 声明**整条被丢**：标题没字号没描边、背景没模糊没亮度、渐变底与暗角全丢
     （实测整图平均差 38.44/255；补上这里之后 3.03/255，残差只剩字形边缘）。
     值取自同一批 `__PLACEHOLDER__`，与 Script 那份**完全一致**，所以 Chrome 那条通道像素不变
     （内联 style 优先级更高、值又相同）。 -->
<style>:root{--bg-color:__BG_COLOR__;--bg-blur:__BG_BLUR__;--bg-blur-scale:__BG_BLUR_SCALE__;--liver-x:__LIVER_X__;--liver-y:__LIVER_Y__;--bg-transform:__BG_TRANSFORM__;--grad-bg:__GRAD_BG__;--vignette-op:__VIGNETTE_OP__;--fs:__FONT_SIZE__;--sk:__STROKE__;--hlc:__HL_COLOR__;--hl-fs:__HL_FS__;--tw:__TEXT_WIDTH__;--text-x:__TEXT_X__;--text-y:__TEXT_Y__;--ls:__LS__;--lh:__LH__;--text-align:__TEXT_ALIGN__;--align-items:__TEXT_ALIGN_ITEMS__;--text-shadow:__SHADOW__;}</style>
<!-- 出片/截图模式追加的静态规则（`cover.rs::COVER_EXPORT_CSS`；预览模式为空串）：
     **截图这条路径不跑时间** ⇒ 入场动画必须在这里关掉 —— `animation: … both` 在"动画时间 0"下会让元素
     停在起始帧（`opacity:0`），静态渲染出来的标题整块不可见。动画跑完的终态就是
     `opacity:1 / translateY(0)`，所以这三条对 Chrome 那条通道**像素等价**（逐字节零回归实测过）。 -->
<style>__EXPORT_CSS__</style>
<!-- 封面字体的 @font-face（cover.rs 注入；没选库内字体就不留东西） -->
<!-- __FONT_FACE__ -->
</head>
<body>
<div id="wrapper"><div id="page">
<div id="bg" class="__BG_CLASS__"><img src="__BG_SRC__"></div>
<div id="frame"><img src="_cover_frame.jpg"></div>
<div id="vignette"></div>
<div id="overlay"></div>
<!-- 特效/表情：**这一层故意不设 z-index**（`z-index:auto` 不建 stacking context），每个特效 div
     自带 z-index，才能成为**独立图层**参与全局叠放（`[cover] layers` 的顺序）。
     ⚠️ 设了 z-index 就把所有特效锁死在同一层里 —— 拖动排序看着生效、出片却不动，**而且不报错**。 -->
<div id="fx-extra" style="position:absolute;inset:0;pointer-events:none;">__FX_HTML__</div>
<div id="title-wrap"><div id="title">__TITLE__</div></div>
</div></div>
<div id="toolbar" style="position:fixed;bottom:16px;right:16px;z-index:99;">
  <button onclick="location.reload()" style="background:rgba(0,0,0,0.5);border:none;color:#fff;font-size:28px;width:48px;height:48px;border-radius:50%;cursor:pointer;line-height:48px;text-align:center;">↻</button>
</div>
<script>
document.documentElement.style.setProperty('--bg-color', '__BG_COLOR__');
document.documentElement.style.setProperty('--bg-blur', '__BG_BLUR__');
document.documentElement.style.setProperty('--bg-blur-scale', '__BG_BLUR_SCALE__');
document.documentElement.style.setProperty('--liver-x', '__LIVER_X__');
document.documentElement.style.setProperty('--liver-y', '__LIVER_Y__');
document.documentElement.style.setProperty('--bg-transform', '__BG_TRANSFORM__');
document.documentElement.style.setProperty('--grad-bg', '__GRAD_BG__');
document.documentElement.style.setProperty('--vignette-op', '__VIGNETTE_OP__');
document.documentElement.style.setProperty('--fs', '__FONT_SIZE__');
document.documentElement.style.setProperty('--sk', '__STROKE__');
document.documentElement.style.setProperty('--hlc', '__HL_COLOR__');
document.documentElement.style.setProperty('--tw', '__TEXT_WIDTH__');
document.documentElement.style.setProperty('--text-x', '__TEXT_X__');
document.documentElement.style.setProperty('--text-y', '__TEXT_Y__');
document.documentElement.style.setProperty('--ls', '__LS__');
document.documentElement.style.setProperty('--lh', '__LH__');
document.documentElement.style.setProperty('--text-align', '__TEXT_ALIGN__');
document.documentElement.style.setProperty('--align-items', '__TEXT_ALIGN_ITEMS__');
document.documentElement.style.setProperty('--text-shadow', '__SHADOW__');
var EXPORT = '__EXPORT__' === 'true';
if (EXPORT) document.documentElement.classList.add('export');
function scaleCover(){var s=Math.min(window.innerWidth/__COVER_W__,window.innerHeight/__COVER_H__);document.getElementById('page').style.transform='scale('+s+')';}
if (!EXPORT) { scaleCover(); window.addEventListener('resize',scaleCover); }
setTimeout(function(){ window.__COVER_READY = true; }, 1500);
</script>
</body>
</html>
