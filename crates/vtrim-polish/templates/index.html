<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTuber Clip</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; font-family:'LXGW WenKai','Noto Sans SC','Microsoft YaHei',sans-serif; background:#2a2a2a; }
#page { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; background:#2a2a2a; padding:10px 0; transition:height 0.2s ease; }
body.editor-open #page { height:calc(100vh - var(--editor-h, 0px)); }
#player-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; width:min(96vw,calc((100vh - var(--editor-h, 0px) - 20px)*16/9)); max-height:calc(100vh - var(--editor-h, 0px) - 12px); transition:width 0.2s ease, max-height 0.2s ease; }
#player { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:4px; overflow:hidden; box-shadow:0 8px 40px rgba(0,0,0,0.6); flex:0 1 auto; min-height:0; }
#player-wrap > #controls, #player-wrap > #playtest { flex:0 0 auto; }

#bg-video-wrap { position:absolute; inset:0; z-index:0; overflow:hidden; display:none; }
#bg-video-wrap.on { display:block; }
#bg-video { width:100%; height:100%; object-fit:cover; filter:blur(28px) brightness(0.5) saturate(1.15); transform:scale(1.15); }
#video-wrap { position:absolute; inset:0; overflow:hidden; z-index:1; }
#video-wrap .source-video { width:100%; height:100%; object-fit:cover; display:block; }
/* 竖屏布局: 主视频保持比例, 左/中放置 */
#video-wrap.portrait { display:flex; align-items:center; }
#video-wrap.portrait.left { justify-content:flex-start; }
#video-wrap.portrait.center { justify-content:center; }
#video-wrap.portrait .source-video { width:auto; height:100%; object-fit:contain; }


#video-canvas { position:absolute; top:0; left:0; width:100%; height:100%; z-index:2; pointer-events:none; object-fit:cover; }
#flash-overlay { position:absolute; inset:0; z-index:5; pointer-events:none; opacity:0; }
#color-overlay { position:absolute; inset:0; z-index:6; pointer-events:none; opacity:0; }
#intro-black { position:absolute; inset:0; z-index:50; background:#000; pointer-events:none; }
#corner-glow { position:absolute; inset:0; z-index:1; pointer-events:none; }
#corner-glow .gb { position:absolute; bottom:-60px; right:-60px; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle,rgba(0,212,255,0.12),transparent 70%); filter:blur(50px); }

#overlay { position:absolute; top:50%; left:50%; width:1920px; height:1080px; transform-origin:center center; pointer-events:none; z-index:10; }
#captions { position:absolute; bottom:80px; left:120px; width:1680px; z-index:10; pointer-events:none; }
.cap { position:absolute; bottom:0; left:0; width:100%; text-align:center; padding:14px 44px; font-weight:700; line-height:1.5; opacity:0; will-change:transform,opacity; }
.cap .hl { paint-order:stroke fill; }

#danmaku { position:absolute; top:0; left:0; width:1920px; height:540px; z-index:20; pointer-events:none; overflow:hidden; }
.dm { position:absolute; white-space:nowrap; font-weight:600; paint-order:stroke fill; opacity:0; will-change:transform; }

#emoji-layer { position:absolute; top:0; left:0; width:1920px; height:1080px; z-index:15; pointer-events:none; }
.sticker-img { position:absolute; width:280px; height:280px; opacity:0; will-change:transform,opacity; pointer-events:none; }

#playtest { width:100%; min-height:28px; display:flex; align-items:center; gap:8px; padding:2px 12px; border-radius:4px 4px 0 0; background:#1a1a1a; font-family:monospace; font-size:12px; color:rgba(255,255,255,0.9); overflow-x:auto; white-space:nowrap; }
#playtest .pt-time { color:#ff6bcb; font-weight:700; margin-right:4px; }
#playtest .pt-tag { display:inline-block; padding:1px 6px; border-radius:3px; margin:0 2px; font-size:11px; font-weight:600; }
#playtest .pt-tag.sticker { background:#7c3aed33; color:#a78bfa; }
#playtest .pt-tag.shake { background:#dc262633; color:#f87171; }
#playtest .pt-tag.flash { background:#fbbf2433; color:#fbbf24; }
#playtest .pt-tag.camera { background:#2563eb33; color:#60a5fa; }
#playtest .pt-tag.other { background:#52525233; color:#a3a3a3; }
#playtest .pt-seg { color:rgba(255,255,255,0.4); font-size:11px; margin-left:auto; }
#player-wrap.fullscreen #playtest { display:none; }
#controls { width:100%; height:56px; z-index:30; display:flex; align-items:center; gap:12px; padding:0 20px; border-radius:0 0 4px 4px; background:#1e1e1e; }
#player-wrap.fullscreen #controls { position:absolute; bottom:0; left:0; border-radius:0; background:linear-gradient(0deg,rgba(30,30,30,0.85) 0%,rgba(30,30,30,0.3) 100%); opacity:0; transition:opacity 0.3s; pointer-events:auto; }
#player-wrap.fullscreen:hover #controls { opacity:1; }
#controls button { background:none; border:none; color:#fff; font-size:20px; cursor:pointer; padding:4px 8px; opacity:0.8; transition:opacity 0.2s; line-height:1; }
#controls button:hover { opacity:1; }
.seek { flex:1; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px; background:rgba(255,255,255,0.2); outline:none; cursor:pointer; }
.seek::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#ff6bcb; border:none; cursor:pointer; }
#controls .time { color:rgba(255,255,255,0.5); font-size:13px; font-family:monospace; letter-spacing:1px; min-width:90px; text-align:center; }
#controls .vol-slider { width:80px; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px; background:rgba(255,255,255,0.2); outline:none; cursor:pointer; }
#controls .vol-slider::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#fff; border:none; cursor:pointer; }
#player-wrap.fullscreen #player { cursor:none; border-radius:0; }
#player-wrap.fullscreen #controls { opacity:0; pointer-events:none; }
#player-wrap.fullscreen.controls-active { cursor:auto; }
#player-wrap.fullscreen.controls-active #controls { opacity:1; pointer-events:auto; }

#error-toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:9999; background:#c0392b; color:#fff; padding:14px 28px; border-radius:8px; font-size:18px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.5); display:none; max-width:80vw; line-height:1.6; }
#error-toast.show { display:block; }
#loading-spinner { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:rgba(255,255,255,0.3); font-size:20px; z-index:9998; }

/* ============================================================
   在线编辑器
   ============================================================ */
#editor-panel { position:fixed; left:0; right:0; bottom:0; height:min(46vh,380px); background:#151515; border-top:1px solid #333; z-index:100; display:none; flex-direction:column; box-shadow:0 -8px 30px rgba(0,0,0,0.55); }
#editor-panel.open { display:flex; }
.editor-toolbar { display:flex; align-items:center; gap:8px; padding:6px 12px; background:#1e1e1e; border-bottom:1px solid #333; font-size:13px; color:#eee; flex:0 0 auto; }
.editor-toolbar .ed-title { font-weight:700; margin-right:auto; }
.editor-toolbar button { background:#2a2a2a; border:1px solid #444; color:#eee; font-size:12px; padding:4px 10px; border-radius:4px; cursor:pointer; }
.editor-toolbar button:hover { background:#3a3a3a; }
.editor-toolbar button.primary { background:#2563eb; border-color:#3b82f6; }
#editor-body { flex:1; display:flex; min-height:0; }
#editor-sidebar { width:280px; flex:0 0 280px; border-right:1px solid #333; padding:10px; overflow-y:auto; background:#1a1a1a; color:#ddd; font-size:13px; transition:width 0.2s ease, flex-basis 0.2s ease, padding 0.2s ease; }
#editor-sidebar.collapsed { width:32px; flex-basis:32px; padding:10px 4px; overflow:hidden; }
#editor-sidebar.collapsed .editor-sidebar-head h4,
#editor-sidebar.collapsed #editor-props,
#editor-sidebar.collapsed #editor-props-empty { display:none; }
.editor-sidebar-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.editor-sidebar-head h4 { margin:0; font-size:14px; color:#fff; }
.editor-sidebar-head button { background:#2a2a2a; border:1px solid #444; color:#eee; font-size:12px; padding:2px 8px; border-radius:4px; cursor:pointer; }
.editor-sidebar-head button:hover { background:#3a3a3a; }
#editor-sidebar label { display:block; margin-bottom:8px; font-size:12px; color:#aaa; }
#editor-sidebar input[type=number], #editor-sidebar textarea, #editor-sidebar input[type=text] { width:100%; margin-top:3px; background:#111; border:1px solid #333; color:#eee; border-radius:4px; padding:5px 6px; font-family:monospace; font-size:12px; box-sizing:border-box; }
#editor-sidebar textarea { resize:vertical; min-height:120px; }
#editor-sidebar .ed-buttons { display:flex; gap:6px; margin-top:4px; flex-wrap:wrap; }
#editor-sidebar .ed-buttons button { flex:1; min-width:70px; background:#2a2a2a; border:1px solid #444; color:#eee; font-size:12px; padding:5px 6px; border-radius:4px; cursor:pointer; }
#editor-sidebar .ed-buttons button.danger { background:#7f1d1d; border-color:#b91c1c; }
#editor-sidebar .ed-empty { color:#777; font-size:12px; padding:10px 0; }
#editor-timeline { flex:1; display:flex; flex-direction:row; min-width:0; }
#editor-left-col { width:120px; flex:0 0 120px; border-right:1px solid #333; background:#1e1e1e; overflow:hidden; display:flex; flex-direction:column; z-index:3; }
#editor-left-col .left-ruler-space { height:22px; flex:0 0 22px; background:#111; border-bottom:1px solid #333; }
#editor-left-col .left-lane { height:34px; flex:0 0 34px; display:flex; align-items:center; justify-content:space-between; padding:0 6px 0 10px; border-bottom:1px solid #222; font-size:12px; color:#ccc; }
#editor-left-col .left-lane .ed-add { background:none; border:none; color:#888; cursor:pointer; font-size:14px; line-height:1; padding:2px 4px; }
#editor-left-col .left-lane .ed-add:hover { color:#fff; }
#editor-right { flex:1; display:flex; flex-direction:column; min-width:0; }
#editor-ruler-scroll { overflow-x:hidden; overflow-y:hidden; border-bottom:1px solid #333; scrollbar-gutter:stable; }
#editor-ruler { position:relative; height:22px; background:#111; cursor:pointer; min-width:100%; }
#editor-ruler span { position:absolute; top:4px; font-size:10px; color:#999; transform:translateX(-50%); pointer-events:none; }
#editor-lanes-scroll { flex:1; overflow:auto; position:relative; background:#181818; scrollbar-gutter:stable; }
#editor-lanes { position:relative; width:max-content; min-width:100%; }
.editor-lane { display:flex; height:34px; border-bottom:1px solid #222; position:relative; }
.editor-lane-track { flex:0 0 auto; position:relative; min-width:0; width:100%; }
.ed-block { position:absolute; top:5px; height:24px; background:#3b82f6; border-radius:4px; color:#fff; font-size:11px; line-height:24px; padding:0 6px; white-space:nowrap; overflow:hidden; cursor:grab; user-select:none; z-index:1; box-sizing:border-box; touch-action:none; }
.ed-block:active { cursor:grabbing; }
.ed-block.type-segments { background:#525252; }
.ed-block.type-camera { background:#2563eb; }
.ed-block.type-sticker { background:#7c3aed; }
.ed-block.type-shake { background:#dc2626; }
.ed-block.type-flash { background:#d97706; }
.ed-block.type-blur { background:#0891b2; }
.ed-block.type-zoom_bounce { background:#059669; }
.ed-block.type-vignette { background:#4d7c0f; }
.ed-block.type-hue_shift { background:#db2777; }
.ed-block.type-stutter { background:#9333ea; }
.ed-block.type-split { background:#ea580c; }
.ed-block.type-noise { background:#64748b; }
.ed-block.type-pulse { background:#0d9488; }
.ed-block.type-color_shift { background:#c026d3; }
.ed-block.type-overlay { background:#ca8a04; }
.ed-block.type-sfx { background:#6d28d9; }
.ed-block.selected { outline:2px solid #fff; z-index:3; }
.ed-resize { position:absolute; right:0; top:0; width:8px; height:100%; cursor:ew-resize; background:rgba(255,255,255,0.35); border-radius:0 4px 4px 0; }
#editor-playhead { position:absolute; top:0; bottom:0; width:2px; background:#ff6bcb; z-index:5; pointer-events:none; }
#editor-status { color:#9ca3af; font-size:12px; }
/* 纯编辑器嵌入模式：隐藏播放器，编辑器占满可视区 */
body.editor-embed #page{ display:none !important; }
body.editor-embed #editor-panel{ position:static; height:100vh; height:100%; width:100%; display:flex; }
body.editor-embed #editor-body{ min-height:0; }
body.editor-embed #loading-spinner{ display:none !important; }

/* player-only: iframe 内只保留纯视频画面，控制条/进度条/编辑器由 WebUI 外部接管 */
body.player-only #controls,
body.player-only #playtest,
body.player-only #btn-fullscreen,
body.player-only #btn-editor,
body.player-only #intro-black {
  display: none !important;
}
body.player-only #player-wrap {
  height: 100%;
  width: 100%;
  max-width: 100%;
  max-height: 100%;
  padding: 0;
}
body.player-only #player {
  height: 100%;
  aspect-ratio: auto;
  border-radius: 0;
  box-shadow: none;
}
body.player-only #page {
  padding: 0;
  background: #000;
}

</style>
<!-- 字幕字体的 @font-face（render/server.rs 注入；没选库内字体就不留东西） -->

<body>
<div id="loading-spinner">⏳ 加载中...</div>
<div id="error-toast"></div>
<!-- __CONFIG__ -->

<div id="page"><div id="player-wrap">
  <div id="player">
    <div id="bg-video-wrap"><video id="bg-video" muted playsinline></video></div>
    <div id="video-wrap">
      <video id="source-video" class="source-video" playsinline preload="auto">
        <source src="clip.mp4" type="video/mp4"></video>
      <canvas id="video-canvas" class="video-canvas"></canvas>
    </div>
    <div id="corner-glow"><div class="gb"></div></div>
    <div id="flash-overlay"></div>
    <div id="color-overlay"></div>
    <div id="intro-black"></div>
    <div id="overlay">
      <div id="emoji-layer"></div>
      <div id="danmaku"></div>
      <div id="captions"></div>
    </div>
  </div>

</div></div>

<div id="editor-panel">
  <div class="editor-toolbar">
    <span class="ed-title">✎ 在线编辑器</span>
    <span id="editor-status">就绪</span>
    <button id="editor-save" class="primary">💾 保存到 polish.toml</button>
    <button id="editor-close">✕ 关闭</button>
  </div>
  <div id="editor-body">
    <div id="editor-sidebar">
      <div class="editor-sidebar-head">
        <h4>事件属性</h4>
        <button id="editor-sidebar-toggle" title="折叠/展开">◀</button>
      </div>

      <div id="editor-props" style="display:none">
        <label>类型 <input type="text" id="ed-type" readonly></label>

        <label>事件 JSON（高级编辑）<textarea id="ed-json" spellcheck="false"></textarea></label>
        <div class="ed-buttons">
          <button id="ed-apply-json">应用 JSON</button>

      </div>

<script>
// ============================================================
// 诊断: 显示页面状态 (方便调试)
// ============================================================
function status(msg){
  var sp=document.getElementById('loading-spinner');
  if(sp)sp.textContent='⏳ '+msg;
  console.log('[polish]', msg);
}

// ============================================================
// 从 <script id="polish-config" type="application/json"> 加载配置
// ============================================================
var CFG = {};
(function(){
  status('读取配置...');
  var el=document.getElementById('polish-config');
  status('config元素: '+(el?'找到':'未找到'));
  if(el){try{CFG=JSON.parse(el.textContent);status('配置已加载');}catch(e){status('配置解析失败: '+e.message);console.warn('Config parse error',e);}}
  if(!CFG||!CFG.source)CFG={};
})();

// ============================================================
// 错误显示
// ============================================================
function showError(msg){
  var el=document.getElementById('error-toast');
  if(el){el.innerHTML=msg;el.classList.add('show');}
  var sp=document.getElementById('loading-spinner');
  if(sp)sp.textContent='✗ '+msg.replace(/<br>/g,' ');
}
function hideLoading(){
  var sp=document.getElementById('loading-spinner');
  if(sp)sp.style.display='none';
}

// GSAP 加载检查
status('等待 GSAP 加载...');
var gsapCheck = setInterval(function(){
  if(typeof gsap !== 'undefined'){
    status('GSAP 已加载');
    clearInterval(gsapCheck);
  }
}, 500);
setTimeout(function(){
  if(typeof gsap === 'undefined'){
    showError('GSAP 加载超时<br>检查网络或更换 CDN 地址');
  }
}, 10000);

// ============================================================
// 虚拟画布缩放
// ============================================================
(function(){
  var o=document.getElementById('overlay'), p=document.getElementById('player'), pw=document.getElementById('player-wrap');
  var params=new URLSearchParams(location.search);
  var isCapture=params.has('capture');
  var isRecord=params.has('record');
  if(isCapture){
    document.body.classList.add('capture');
    pw.style.width='100vw'; pw.style.height='100vh'; pw.style.borderRadius='0';
  }
  if(isRecord){
    pw.style.width='100vw'; pw.style.height='100vh'; pw.style.borderRadius='0';
    var rs=parseFloat(params.get('start')||'0'), re=parseFloat(params.get('end')||'99999');
    window.__RECORD_DONE=0; window.__RECORD_READY=0;
    function rInit(){
      var v=document.getElementById('source-video');
      var p=document.getElementById('player-wrap');
      v.currentTime=rs;
      v.play().catch(function(){});
      // timeupdate: GSAP seek + 信号递增
      v.addEventListener('timeupdate', function(){
        var t=v.currentTime;
        if(t>=re||t>=v.duration-0.03){v.pause();window.__RECORD_DONE=1;return;}
        if(window.__TIMELINE) window.__TIMELINE.seek(t);
        if(window.fireSounds) window.fireSounds(t);
        window.__RECORD_READY++;
      });
    }
    var ri=setInterval(function(){if(window.__TIMELINE){clearInterval(ri);rInit();}},100);
  }
  function r(){
    if(!p) return;
    // 同时考虑宽高，避免窗口/编辑器改变宽高比时字幕贴纸偏移
    var s=Math.min(p.clientWidth/1920, p.clientHeight/1080);
    o.style.transform='translate(-50%,-50%) scale('+s+')';
    window.__overlayScale=s;
  }
  r(); window.addEventListener('resize',r);
  window.__updateOverlayScale=r;
})();

// 百分比字符串 → 像素 (基于 1920×1080 虚拟画布)
function pctPx(v,total){return parseFloat(v)/100*total;}
function pctX(v){return pctPx(v,1920);}
function pctY(v){return pctPx(v,1080);}
// AABB 碰撞检测
function rectOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

// ============================================================
// 种子随机
// ============================================================
window.__RNG_SEED=Date.now();
function seededRandom(){var x=Math.sin(window.__RNG_SEED++)*10000;return x-Math.floor(x);}
function rng(){return(typeof window.__RNG_SEED==='number')?seededRandom():Math.random();}

// ============================================================
// Sticker 映射
// ============================================================
var assets=CFG._assets||{};
var STICKER_MAP=assets.sticker_map||{};

// 反应规则: 从 config 的 reactions 或默认
// ============================================================
// 音频事件调度
// ============================================================
var SOUND_EVENTS=[];
function scheduleSound(time,fn,type,vol,dur){SOUND_EVENTS.push({time:time,fired:false,fn:fn,type:type||'pop-notice',volume:vol||0.1,duration:dur});}
var CURRENT_T=0; // 当前播放时间 (fireSounds 更新, 音效音量跟随用)
function fireSounds(t){
  CURRENT_T=t;
  for(var i=0;i<SOUND_EVENTS.length;i++){
    var e=SOUND_EVENTS[i];
    if(!e.fired&&e.time<=t&&e.time>t-0.12){e.fired=true;e.fn();}
  }
}
// 音效音量跟随视频响度: 查响度曲线 → 视频吵压、安静正常 (与 render 混音同思路)
function curveAdjust(t){
  if(!CFG.loudness_curve||!CFG.loudness_curve.length) return 1.0;
  var db=-26.0;
  for(var i=CFG.loudness_curve.length-1;i>=0;i--){

  vol=vol*curveAdjust(CURRENT_T);

  var target=vol*(MASTER_MUTED?0:MASTER_VOL);
  var a;
  // 如果缓存中已有该音效且正在播放，clone 一份新实例（避免打断前一次）
  var cached=sfxCache[name];
  if(cached&&!cached.ended&&cached.currentTime>0){
    a=cached.cloneNode();  // clone 会复制 src，浏览器复用已下载的缓存
  } else if(cached){
    a=cached;

  var steps=0;
  var fade=setInterval(function(){

  var stopAt=Math.min(dur||1.5,30);

//

// 老工程与 LLM 一直只写单个 color（colors 从未出现过），单色按「该色 → 透明」。
//
// ⚠ 同样必须留在**脚本顶层**：init() 里的 handlers.overlay 与 canvas IIFE 里的

  document.getElementById('btn-refresh').addEventListener('click',function(){window.location.reload();});

  // ---- 总音量控制 (预览 UI, localStorage 记忆) ----
  var volBtn=document.getElementById('btn-vol'),volBar=document.getElementById('vol-bar');

  // ---- 全屏 ----
  var fb=document.getElementById('btn-fullscreen'),pw=document.getElementById('player-wrap'),player=document.getElementById('player'),fsIdleTimer=null;
  function showControls(){
    pw.classList.add('controls-active');

  }
  function toggleFullscreen(){
    if(!document.fullscreenElement&&!document.webkitFullscreenElement){
      if(pw.requestFullscreen)pw.requestFullscreen();
      else if(pw.webkitRequestFullscreen)pw.webkitRequestFullscreen();
    } else {
      if(document.exitFullscreen)document.exitFullscreen();

  }

    if(fs){pw.addEventListener('mousemove',showControls);showControls();}
    else{pw.removeEventListener('mousemove',showControls);pw.classList.remove('controls-active');clearTimeout(fsIdleTimer);}
  }
  document.addEventListener('fullscreenchange',onFsChange);
  document.addEventListener('webkitfullscreenchange',onFsChange);
  ui(0);
  updatePlayTest(0);
  hideLoading();
}

      'top-left':[16.67,16.67],'top':[50,16.67],'top-right':[83.33,16.67],
      'mid-left':[16.67,50],'center':[50,50],'mid-right':[83.33,50],
      'bot-left':[16.67,83.33],'bottom':[50,83.33],'bot-right':[83.33,83.33]

        if (!idx[type]) idx[type] = [];

      var by = parseFloat(ob[1]); if (isNaN(by)) by = ay;
      ox = lerp(ax, bx, p);
      oy = lerp(ay, by, p);
    }
    return { zoom: zoom, ox: ox * 1920 / 100, oy: oy * 1080 / 100 };
  }

  function getActiveSubs(t, subs) {
    var out = [];
    for (var i = 0; i < subs.length; i++) {
      var s = subs[i];
      if (t < s.start || t >= s.end) continue;
      var opacity = 1, yOff = 0;
      var fadeIn = 0.35, fadeOut = 0.18;
      if (t - s.start < fadeIn) {
        var p = (t - s.start) / fadeIn;
        opacity = E.pow2_out(p);
        yOff = 20 * (1 - opacity);
      } else if (s.end - t < fadeOut) {
        var p = (s.end - t) / fadeOut;
        opacity = E.pow2_in(p);
        yOff = -8 * (1 - p);
      }
      var hlParts = [];

      // parse html for highlight spans
      var html = s.html || s.text || '';
      var re = /<span class="hl">([^<]+)<\/span>|[^<]+/g;
      var m;
      while ((m = re.exec(html)) !== null) {
        if (m[1]) hlParts.push({ text: m[1], hl: true });
        else if (m[0].trim()) hlParts.push({ text: m[0], hl: false });
      }
      if (hlParts.length === 0) hlParts.push({ text: s.text || '', hl: false });

      out.push({ parts: hlParts, opacity: opacity, yOffset: yOff });
    }
    return out;
  }

  function getActiveDms(t, dms) {
    var out = [];
    for (var i = 0; i < dms.length; i++) {
      var d = dms[i];
      if (t < d.start || t >= d.end) continue;
      var travel = d.travel_duration || 8;
      var textW = DM_WIDTHS[i] || (d.text || '').length * 55;
      var el = t - d.start;
      var fadeIn = 0.3, fadeOut = 0.2;
      var y = (d.y / 1920) * 540;

      // x 始终由滚动进度决定 (与 opacity 独立)
      var progress = Math.max(0, (el - fadeIn) / travel);
      var x = 1920 - Math.min(progress, 1) * (1920 + textW);

      // opacity = fadeIn × fadeOut
      var opacity = 0.9;
      if (el < fadeIn) {
        opacity = 0.9 * (el / fadeIn);
        x = 1920;
      } else if (t > d.end - fadeOut) {
        opacity = 0.9 * Math.max(0, (d.end - t) / fadeOut);
      }

      if (opacity < 0.005 || x < -textW - 50) continue;
      out.push({ text: d.text || '', opacity: opacity, x: x, y: y });
    }
    return out;
  }

  function getActiveSticker(t, items) {
    var out = [];
    for (var i = 0; i < items.length; i++) {
      var e = items[i];
      var imgEl = e._img;
      if (!imgEl || imgEl.tagName !== 'IMG') continue;
      var et = e.time, dur = e.duration || 2.5;
      if (t < et || t > et + dur + 0.65) continue;
      var popIn = 0.35, floatUp = 0.4, fadeOut = 0.3;
      var opacity = 0, scale = 1, rot = 0, yOff = 0;

      if (t - et < popIn) {
        var p = (t - et) / popIn;
        var bp = E.back_out(p, 3);
        scale = 0.3 + 0.7 * bp;
        rot = -15 + 15 * bp;
        opacity = E.pow2_out(p);
      } else if (t < et + popIn + floatUp) {
        var p = (t - et - popIn) / floatUp;
        opacity = 1; scale = 1; rot = 0;
        yOff = -18 * p;
      } else if (t < et + popIn + floatUp + dur) {
        opacity = 1; yOff = -18;
      } else {
        var p = (t - et - popIn - floatUp - dur) / fadeOut;
        opacity = 1 - p;
        scale = 1 - 0.6 * p;
        yOff = -18;
      }
      if (opacity < 0.005) continue;

      var left = parseFloat(imgEl.style.left) || 0;
      var top = parseFloat(imgEl.style.top) || 0;

      // 使用预解码 GIF 帧 (如有) 或 fallback 到 DOM img
      var frameIndex = 0;
      if (e._bitmaps && e._bitmaps.length > 1 && e._delays) {
        var elapsedMs = (t - et) * 1000;
        var total = 0;
        for (var di = 0; di < e._delays.length; di++) total += e._delays[di];
        if (total > 0) {
          var loopPos = elapsedMs % total;
          var acc = 0;
          for (di = 0; di < e._delays.length; di++) {
            acc += e._delays[di];
            if (loopPos < acc) { frameIndex = di; break; }
          }
        }
      }

      var src = (e._bitmaps && e._bitmaps[frameIndex]) || imgEl;
      var w = 280, h = 280;
      out.push({ img: src, opacity: opacity, scale: scale, rot: rot,
                 x: left + 140, y: top + 140 + yOff, w: w, h: h });
    }
    return out;
  }

  function getShake(t, items) {
    for (var i = 0; i < items.length; i++) {
      var sh = items[i];
      if (t >= sh.time && t < sh.time + 0.2) {
        var off = sh.ev.intensity || 14;
        var dt = t - sh.time;
        if (dt < 0.04) return { x: off, y: -off };
        if (dt < 0.08) return { x: -off, y: off };
        if (dt < 0.12) return { x: off/2, y: -off/2 };
        if (dt < 0.16) return { x: -off/2, y: off/2 };
        return { x: 0, y: 0 };
      }
    }
    return { x: 0, y: 0 };
  }

  function getFlash(t, items) {
    for (var i = 0; i < items.length; i++) {
      var f = items[i];
      var et = f.time, color = f.ev.color || '#ffffff', dur = f.duration || 0.35;
      if (t >= et && t < et + 0.04 + dur) {
        var dt = t - et;
        if (dt < 0.04) return { opacity: 0.20 * (dt / 0.04), color: color };
        var fade = (dt - 0.04) / dur;
        return { opacity: 0.20 * (1 - fade), color: color };
      }
    }
    return { opacity: 0, color: '#ffffff' };
  }

  function getBlur(t, items) {
    for (var i = 0; i < items.length; i++) {
      var b = items[i];
      var et = b.time;
      if (t >= et && t < et + 0.80) {
        var dt = t - et;
        if (dt < 0.12) return 8;
        if (dt < 0.48) return 8;
        return 8 * (1 - (dt - 0.48) / 0.32);
      }
    }
    return 0;
  }

  // overlayStops / overlayGradientCss 在脚本顶层（上文），此处直接用。
  function getOverlayState(t, items) {
    for (var i = 0; i < items.length; i++) {
      var o = items[i];
      var et = o.time, dur = o.duration || 1.5;
      var ev = o.ev;
      if (t >= et && t < et + dur) {
        var dt = t - et;
        var fadeIn = 0.4, fadeOut = 0.4;
        // 数值判定，不用 `|| 1` —— 不透明度 0 是合法值，不能被 falsy 判成 1
        var opacity = typeof ev.opacity === 'number' ? ev.opacity : 1;
        if (dt < fadeIn) opacity *= dt / fadeIn;
        else if (dur - dt < fadeOut) opacity *= (dur - dt) / fadeOut;
        if (opacity < 0.005) continue;
        var ot = ev.overlay_type || '';
        var stops = overlayStops(ev);
        if (ot === 'color') {
          var solid = (ev.color != null && String(ev.color).trim()) || (stops ? stops[0] : '');
          if (solid) return { type: 'color', color: solid, opacity: opacity };
          continue;
        }
        if (ot === 'gradient' && stops) {
          return { type: 'gradient', colors: stops, shape: ev.shape || 'linear', opacity: opacity };
        }
        // 类型不认识 / 值不全：继续看窗口里的下一条，别把整窗吃掉
      }
    }
    return null;
  }

  function getIntroBlack(t) {
    if (t < 0.5) { return 1 - E.sine_out(t / 0.5); }
    return 0;
  }

  function getStutterVideo(t, items) {
    for (var i = 0; i < items.length; i++) {
      var st = items[i], et = st.time, off = st.ev.intensity || 12;
      if (t >= et && t < et + 0.12) {
        var dt = t - et;
        if (dt < 0.06) return { x: -off, y: off };
        return { x: off, y: -off };
      }
    }
    return null;
  }

  function getSplitVideo(t, items) {
    for (var i = 0; i < items.length; i++) {
      var sp = items[i], et = sp.time, inten = sp.ev.intensity || 30;
      if (t >= et && t < et + 0.12) {
        var dt = t - et;
        if (dt < 0.06) return { scale: 0.95, skewX: -inten, x: -inten * 0.3 };
        return { scale: 1, skewX: 0, x: 0 };
      }
    }
    return null;
  }

  function getZoomBounce(t, items, curZoom) {
    for (var i = 0; i < items.length; i++) {
      var zb = items[i], et = zb.time;
      if (t >= et && t < et + 0.30) {
        var dt = t - et;
        if (dt < 0.08) return curZoom * 1.10;
        return curZoom;
      }
    }
    return curZoom;
  }

  function getPulse(t, items, curZoom) {
    for (var i = 0; i < items.length; i++) {
      var p = items[i], et = p.time;
      if (t >= et && t < et + 0.48) {
        var dt = t - et;
        if (dt < 0.12) return curZoom * 1.06;
        if (dt < 0.28) return curZoom * 0.97;
        return curZoom;
      }
    }
    return curZoom;
  }

  function getHueShiftFlash(t, items) {
    for (var i = 0; i < items.length; i++) {
      var h = items[i], et = h.time, color = h.ev.color || '#ff0040';
      if (t >= et && t < et + 0.95) {
        var dt = t - et;
        if (dt < 0.15) return { opacity: 0.25 * (dt / 0.15), color: color };
        return { opacity: 0.25 * (1 - (dt - 0.15) / 0.80), color: color };
      }
    }
    return null;
  }

  function getNoiseOpacity(t, items) {
    for (var i = 0; i < items.length; i++) {
      var n = items[i], et = n.time;
      if (t >= et && t < et + 0.80) {
        var dt = t - et;
        if (dt < 0.08) return 0.08 * (dt / 0.08);
        return 0.08 * (1 - (dt - 0.08) / 0.72);
      }
    }
    return 0;
  }

  function getColorShift(t, items) {
    for (var i = 0; i < items.length; i++) {
      var c = items[i], et = c.time;
      if (t >= et && t < et + 1.0) {
        var dt = t - et;
        if (dt < 0.1) return 'sepia(0.6) saturate(1.4)';
        var p = (dt - 0.1) / 0.6;
        return 'sepia(' + (0.6 * (1 - p)) + ') saturate(' + (1.4 - 0.4 * p) + ')';
      }
    }
    return '';
  }

  // ---- 绘图函数 ----

  function ensureCanvas() {
    if (!CANVAS) {
      CANVAS = document.getElementById('_polish_cc');
      if (!CANVAS) {
        CANVAS = document.createElement('canvas');
        CANVAS.id = '_polish_cc';
        CANVAS.width = 1920;
        CANVAS.height = 1080;
        CANVAS.style.cssText = 'position:fixed;top:0;left:-9999px;width:1px;height:1px';
        document.body.appendChild(CANVAS);
      }
    }
    if (!CTX) CTX = CANVAS.getContext('2d');
  }

  function blobToB64(blob) {
    return new Promise(function(resolve) {
      var r = new FileReader();
      r.onload = function() { resolve(r.result.split(',')[1]); };
      r.readAsDataURL(blob);
    });
  }

  function renderFrame(t, ctx, idx, videoBitmap) {
    ctx.clearRect(0, 0, 1920, 1080);

    var cam = getActiveCamera(t, idx.camera);
    var shake = getShake(t, idx.shake);
    var blurAmt = getBlur(t, idx.blur);
    var stutter = getStutterVideo(t, idx.stutter);
    var split = getSplitVideo(t, idx.split);
    var curZoom = cam.zoom;
    var zbZoom = getZoomBounce(t, idx.zoom_bounce, curZoom);
    var plZoom = getPulse(t, idx.pulse, curZoom);
    var finalZoom = Math.max(zbZoom, plZoom);
    var colorShift = getColorShift(t, idx.color_shift);

    // ---- video layer ----
    ctx.save();
    if (shake.x || shake.y) ctx.translate(shake.x, shake.y);
    if (blurAmt > 0) ctx.filter = 'blur(' + blurAmt + 'px)';
    if (colorShift) ctx.filter = (ctx.filter ? ctx.filter + ' ' : '') + colorShift;
    // stutter / split / zoom on video
    if (stutter) ctx.translate(stutter.x, stutter.y);
    else if (split) { ctx.translate(split.x, 0); ctx.transform(1, split.skewX/100, 0, 1, 0, 0); ctx.scale(split.scale, split.scale); }
    // camera zoom
    // 判据是「缩放不等于 1」而不是「大于 1」：画中画档位（zoom<1）也是合法运镜。
    if (Math.abs(finalZoom - 1.0) > 0.001) {
      ctx.translate(cam.ox, cam.oy);
      ctx.scale(finalZoom, finalZoom);
      ctx.translate(-cam.ox, -cam.oy);
    }
    ctx.drawImage(videoBitmap, 0, 0, 1920, 1080);
    ctx.restore();

    // ---- noise overlay ----
    var noiseOp = getNoiseOpacity(t, idx.noise);
    if (noiseOp > 0.005) {
      ctx.save();
      ctx.globalAlpha = noiseOp;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 1920, 1080);
      ctx.restore();
    }

    // ---- flash ----
    var flash = getFlash(t, idx.flash);
    if (flash.opacity > 0.005) {
      ctx.save();
      ctx.globalAlpha = flash.opacity;
      ctx.fillStyle = flash.color;
      ctx.fillRect(0, 0, 1920, 1080);
      ctx.restore();
    }

    // ---- hue_shift flash ----
    var hueFl = getHueShiftFlash(t, idx.hue_shift);
    if (hueFl) {
      ctx.save();
      ctx.globalAlpha = hueFl.opacity;
      ctx.fillStyle = hueFl.color;
      ctx.fillRect(0, 0, 1920, 1080);
      ctx.restore();
    }

    // ---- overlay ----
    var ov = getOverlayState(t, idx.overlay);
    if (ov) {
      ctx.save();
      ctx.globalAlpha = ov.opacity;
      if (ov.type === 'color') {
        ctx.fillStyle = ov.color;
        ctx.fillRect(0, 0, 1920, 1080);
      } else if (ov.type === 'gradient' && ov.colors.length >= 2) {
        // 长度守卫：overlayStops 已保证 ≥2 档，这里是唯一会打断整个 chunk 的地方，再兜一道
        var grad = ov.shape === 'radial'
          ? ctx.createRadialGradient(960, 540, 0, 960, 540, 960)
          : ctx.createLinearGradient(0, 0, 1920, 1080);
        for (var gi = 0; gi < ov.colors.length; gi++) {
          grad.addColorStop(gi / (ov.colors.length - 1), ov.colors[gi]);
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1920, 1080);
      }
      ctx.restore();
    }

    // ---- intro black ----
    var ib = getIntroBlack(t);
    if (ib > 0.005) {
      ctx.save();
      ctx.globalAlpha = ib;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, 1920, 1080);
      ctx.restore();
    }

    // ---- captions ----
    var subS = idx.subStyle;
    var caps = getActiveSubs(t, idx.subs);
    if (caps.length > 0) {
      var fs = (subS.size || 72) + 'px';
      var ff = (subS.font || 'LXGW WenKai') + ',"Microsoft YaHei","Noto Sans SC",sans-serif';
      var color = subS.color || '#dcbda0';
      var hlColor = subS.highlight_color || '#f56b41';
      var strokeStr = subS.stroke || '12px #403c3b';
      var sw = parseFloat(strokeStr) || 12;
      var sc = strokeStr.replace(/^[\d.]+px\s*/, '') || '#403c3b';

      ctx.font = '700 ' + fs + ' ' + ff;
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      var cx = 960, cy = 960;

      caps.forEach(function(cap) {
        ctx.save();
        ctx.globalAlpha = cap.opacity;
        // measure total width
        ctx.textAlign = 'left';
        var totalW = 0;
        cap.parts.forEach(function(p) { totalW += ctx.measureText(p.text).width; });
        var sx = cx - totalW / 2;
        cap.parts.forEach(function(p) {
          var pw = ctx.measureText(p.text).width;
          if (p.hl) {
            ctx.strokeStyle = sc; ctx.lineWidth = sw;
            ctx.strokeText(p.text, sx, cy + cap.yOffset);
            ctx.fillStyle = hlColor;
          } else {
            ctx.strokeStyle = sc; ctx.lineWidth = sw;
            ctx.strokeText(p.text, sx, cy + cap.yOffset);
            ctx.fillStyle = color;
          }
          ctx.fillText(p.text, sx, cy + cap.yOffset);
          sx += pw;
        });
        ctx.restore();
      });
    }

    // ---- danmaku ----
    var dmS = idx.dmStyle;
    var dms_a = getActiveDms(t, idx.dms);
    if (dms_a.length > 0) {
      var fs_dm = (dmS.font_size || 42) + 'px';
      var color_dm = dmS.color || '#ffffff';
      var strokeStr_dm = dmS.stroke || '2px #000';
      var sw_dm = parseFloat(strokeStr_dm) || 2;
      var sc_dm = strokeStr_dm.replace(/^[\d.]+px\s*/, '') || '#000000';

      ctx.font = '600 ' + fs_dm + ' "Microsoft YaHei","Noto Sans SC",sans-serif';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';

      dms_a.forEach(function(dm) {
        ctx.save();
        ctx.globalAlpha = dm.opacity;
        ctx.textAlign = 'left';
        ctx.strokeStyle = sc_dm;
        ctx.lineWidth = sw_dm;
        ctx.strokeText(dm.text, dm.x, dm.y);
        ctx.fillStyle = color_dm;
        ctx.fillText(dm.text, dm.x, dm.y);
        ctx.restore();
      });
    }

    // ---- sticker ----
    var stickers = getActiveSticker(t, idx.sticker);
    var allEI = stickers;
    allEI.forEach(function(ei) {
      ctx.save();
      ctx.globalAlpha = ei.opacity;
      ctx.translate(ei.x, ei.y);
      ctx.rotate(ei.rot * Math.PI / 180);
      ctx.scale(ei.scale, ei.scale);
      ctx.drawImage(ei.img, -ei.w/2, -ei.h/2, ei.w, ei.h);
      ctx.restore();
    });
  }

  // ---- 帧预加载 (从 Rust 接收 base64 JPEG 帧) ----
  window.__LOAD_FRAMES = function(batch) {
    if (!window.__FRAME_BYTES) window.__FRAME_BYTES = [];
    for (var i = 0; i < batch.length; i++) {
      window.__FRAME_BYTES.push(batch[i]);
    }
  };

  // ---- 主入口 ----
  window.__CAPTURE_CHUNK = async function(startFrame, endFrame, fps) {
    ensureCanvas();
    var frameCount = endFrame - startFrame;
    if (!window.__FRAME_BYTES || window.__FRAME_BYTES.length < frameCount) {
      window.__CAPTURE_ERROR = 'Need ' + frameCount + ' frames, have ' +
        (window.__FRAME_BYTES ? window.__FRAME_BYTES.length : 0);
      window.__CAPTURE_DONE = true;
      return 0;
    }
    window.__CAPTURE_ERROR = '';

    buildIndex();
    var ctx = CTX, idx = EVENT_IDX;

    // 预加载 sticker 图片 + 预解码 GIF 帧
    var emojiData = window.__EMOJI_DATA || {};
    var eLayer = document.getElementById('emoji-layer');
    if (eLayer) {
      eLayer.style.setProperty('display', 'block', 'important');
      eLayer.style.setProperty('visibility', 'visible', 'important');
      eLayer.style.setProperty('opacity', '1', 'important');
    }
    // 预解码所有 sticker GIF 帧为 ImageBitmap
    for (var _ei = 0; _ei < idx.sticker.length; _ei++) {
      var _e = idx.sticker[_ei];
      var _name = (_e.ev && _e.ev.name) || '';
      var _ed = emojiData[_name];
      if (_ed && _ed.frames && _ed.frames.length > 0) {
        try {
          _e._bitmaps = await Promise.all(_ed.frames.map(async function(b64) {
            var r = await fetch('data:image/png;base64,' + b64);
            var b = await r.blob();
            return createImageBitmap(b);
          }));
          _e._delays = _ed.delays;
          _e._fw = _e._bitmaps[0].width;
          _e._fh = _e._bitmaps[0].height;
        } catch(_err) {}
      }
    }

    for (var fi = startFrame; fi < endFrame; fi++) {
      var t = fi / fps;
      var relIdx = fi - startFrame;
      var frameB64 = window.__FRAME_BYTES[relIdx];
      if (!frameB64) continue;

      // decode JPEG frame → ImageBitmap
      var resp = await fetch('data:image/jpeg;base64,' + frameB64);
      var blob = await resp.blob();
      var bitmap = await createImageBitmap(blob);

      // render frame (数学状态, 无 DOM 读取)
      renderFrame(t, ctx, idx, bitmap);
      bitmap.close();

      // capture JPEG
      var capBlob = await new Promise(function(r) { CANVAS.toBlob(r, 'image/jpeg', 0.6); });
      var b64 = await blobToB64(capBlob);
      window.__FRAME_BUF.push(b64);

      if (fi % 30 === 0 || fi === endFrame - 1) {
        window.__CAPTURE_PROGRESS = ((fi - startFrame + 1) / frameCount * 100).toFixed(0);
      }
    }

    window.__CAPTURE_DONE = true;
    window.__CAPTURE_COUNT = window.__FRAME_BUF.length;
    return window.__FRAME_BUF.length;
  };

  window.__CAPTURE_RESET = function() {
    EVENT_IDX = null;
    window.__FRAME_BYTES = [];
    window.__FRAME_BUF = [];
    window.__CAPTURE_DONE = false;
    window.__CAPTURE_PROGRESS = '0';
    window.__CAPTURE_COUNT = 0;
    window.__CAPTURE_ERROR = '';
  };

  window.__GET_FRAMES = function(start, end) {
    return JSON.stringify((window.__FRAME_BUF || []).slice(start, end));
  };
})();
</script>

<script>
// ============================================================
// 在线编辑器：多轨道时间轴 + 拖拽移动/缩放 + 保存 polish.toml
// ============================================================
(function(){
  var EDITOR = {
    duration: 60,
    scale: 60,
    selected: null,
    playheadTimer: null,
    waitTimer: null,
    dirty: false
  };
  var LANE_DEFS = [
    { type:'segments', label:'分段', duration:true },
    { type:'camera', label:'运镜', duration:true },
    { type:'sticker', label:'贴纸', duration:true },
    { type:'fx', label:'视觉特效', types:['shake','flash','blur','zoom_bounce','vignette','hue_shift','stutter','split','noise','pulse','color_shift'] },
    { type:'overlay', label:'覆盖层', duration:true },
    { type:'sfx', label:'音效' }
  ];
  var DEFAULT_DUR = { camera:1.0, sticker:2.0, overlay:1.5, sfx:0.5 };
  var LABEL_W = 120; // lane 左侧说明标签宽度

  function round1(v){ return Math.round(v*10)/10; }
  function round2(v){ return Math.round(v*100)/100; }
  function getSegments(){ return CFG.segments || []; }
  function getDuration(){ return window.__DURATION || META.duration || CFG.duration || 60; }
  function defaultDuration(type){ return DEFAULT_DUR[type] || 0.4; }
  // 事件跨度（秒）= end - time；老数据的 duration 兜底
  function evDur(ev, def){
    if(ev.end != null) return Math.max(0.1, ev.end - (ev.time || 0));
    if(ev.duration != null) return Math.max(0.1, ev.duration);
    return def;
  }
  function laneDuration(ev){ return evDur(ev, defaultDuration(ev.type)); }
  function labelFor(ev){
    if(ev.type==='sticker') return ev.keyword || ev.name || '贴纸';
    // 硬切（cut）加「切·」前缀，与 WebUI 时间轴的块标签一致
    if(ev.type==='camera') return (ev.cut ? '切·' : '') + (ev.zoom || '运镜');
    if(ev.type==='sfx') return ev.name || '音效';
    if(ev.type==='overlay') return ev.overlay_type || '覆盖';
    return ev.type;
  }
  function laneEvents(def){
    var out=[];
    var types=def.types || [def.type];
    var segs=getSegments();
    for(var si=0; si<segs.length; si++){
      var seg=segs[si];
      (seg.events||[]).forEach(function(ev,ei){
        if(types.indexOf(ev.type)>=0) out.push({ si:si, ei:ei, ev:ev, seg:seg });
      });
    }
    out.sort(function(a,b){ return a.ev.time - b.ev.time; });
    return out;
  }

  function render(){
    var dur=getDuration();
    EDITOR.duration=dur;
    var totalW=Math.max(dur*EDITOR.scale, 600);
    var lanes=document.getElementById('editor-lanes');
    var ruler=document.getElementById('editor-ruler');
    if(!lanes || !ruler) return;
    lanes.innerHTML='';
    ruler.innerHTML='';
    var leftCol=document.getElementById('editor-left-col');
    if(leftCol) leftCol.innerHTML='';

    // 刻度尺：从 0 开始，不包含左侧标签
    ruler.style.width=totalW+'px';
    for(var t=0; t<=dur+0.001; t+=5){
      var sp=document.createElement('span');
      sp.style.left=(t*EDITOR.scale)+'px';
      sp.textContent=t+'s';
      ruler.appendChild(sp);
    }

    var ph=document.createElement('div');
    ph.id='editor-playhead';
    ph.style.left='0px';
    lanes.appendChild(ph);

    // 左侧标签列顶部占位（对应刻度尺高度）
    if(leftCol){
      var rulerSpace=document.createElement('div');
      rulerSpace.className='left-ruler-space';
      leftCol.appendChild(rulerSpace);
    }

    LANE_DEFS.forEach(function(def){
      // 左侧标签列
      if(leftCol){
        var leftLane=document.createElement('div');
        leftLane.className='left-lane';
        var span=document.createElement('span');
        span.textContent=def.label;
        leftLane.appendChild(span);
        var addBtn=document.createElement('button');
        addBtn.className='ed-add';
        addBtn.textContent='+';
        addBtn.title='添加 '+def.label;
        addBtn.addEventListener('click', function(e){ e.stopPropagation(); addEvent(def.type); });
        leftLane.appendChild(addBtn);
        leftCol.appendChild(leftLane);
      }

      // 右侧事件轨道（不含 label）
      var lane=document.createElement('div');
      lane.className='editor-lane';
      var track=document.createElement('div');
      track.className='editor-lane-track';
      track.style.width=totalW+'px';
      track.dataset.lane=def.type;
      lane.appendChild(track);
      lanes.appendChild(lane);

      if(def.type==='segments'){
        getSegments().forEach(function(seg,si){
          addSegmentBlock(track, { si:si, ei:-1, seg:seg });
        });
      } else {
        laneEvents(def).forEach(function(item){
          addBlock(track, item, def);
        });
      }
    });
    updatePlayhead();
    // 同步刻度尺与事件轨道的滚动位置
    var lsc=document.getElementById('editor-lanes-scroll');
    var rsc=document.getElementById('editor-ruler-scroll');
    if(lsc && rsc) rsc.scrollLeft=lsc.scrollLeft;
  }

  function addBlock(track, item, def){
    var ev=item.ev;
    var el=document.createElement('div');
    el.className='ed-block type-'+(ev.type||'other');
    el.dataset.si=item.si;
    el.dataset.ei=item.ei;
    el.dataset.lane=def.type;
    var dur=laneDuration(ev);
    el.style.left=(ev.time*EDITOR.scale)+'px';
    el.style.width=Math.max(dur*EDITOR.scale, 10)+'px';
    el.textContent=labelFor(ev);
    el.title=ev.type+' @ '+round1(ev.time)+'s';
    if(def.type==='segments'){
      track.appendChild(el);
      return;
    }
    var resize=document.createElement('span');
    resize.className='ed-resize';
    el.appendChild(resize);
    el.addEventListener('pointerdown', function(e){
      if(e.target===resize) startResize(e,item,el);
      else startDrag(e,item,el);
    });
    el.addEventListener('click', function(e){ e.stopPropagation(); select(item,el); });
    track.appendChild(el);
  }

  function addSegmentBlock(track, item){
    var seg=item.seg;
    var el=document.createElement('div');
    el.className='ed-block type-segments';
    el.dataset.si=item.si;
    el.dataset.ei=-1;
    el.dataset.lane='segments';
    el.style.left=(seg.start*EDITOR.scale)+'px';
    el.style.width=Math.max((seg.end-seg.start)*EDITOR.scale, 8)+'px';
    el.textContent=seg.note || ('分段 '+(item.si+1));
    el.title='分段 '+round1(seg.start)+'s ~ '+round1(seg.end)+'s';
    var resize=document.createElement('span');
    resize.className='ed-resize';
    el.appendChild(resize);
    el.addEventListener('pointerdown', function(e){
      if(e.target===resize) startSegmentResize(e,item,el);
      else startSegmentDrag(e,item,el);
    });
    track.appendChild(el);
  }

  function positionSegmentBlock(el,item){
    var seg=item.seg;
    el.style.left=(seg.start*EDITOR.scale)+'px';
    el.style.width=Math.max((seg.end-seg.start)*EDITOR.scale, 8)+'px';
    el.title='分段 '+round1(seg.start)+'s ~ '+round1(seg.end)+'s';
    updatePlayhead();
  }

  function updateSegmentEventBlocks(si, skipEl){
    var seg=getSegments()[si];
    if(!seg) return;
    document.querySelectorAll('.ed-block[data-si="'+si+'"]').forEach(function(b){
      if(b===skipEl) return;
      var ei=parseInt(b.dataset.ei,10);
      if(ei>=0 && seg.events && seg.events[ei]){
        positionBlock(b,{ ev:seg.events[ei] });
      }
    });
  }

  function startSegmentDrag(e,item,el){
    e.preventDefault();
    var startX=e.clientX;
    var startTime=item.seg.start;
    var startEnd=item.seg.end;
    var dur=getDuration();
    var len=startEnd-startTime;
    var origEventTimes=(item.seg.events||[]).map(function(ev){ return ev.time; });
    var moved=false;
    function onMove(ev){
      var dx=ev.clientX-startX;
      var ns=Math.max(0, Math.min(dur-len, startTime+dx/EDITOR.scale));
      ns=round2(ns);
      if(Math.abs(ns-item.seg.start)>0.001){
        moved=true;
        var delta=ns-startTime;
        item.seg.start=ns;
        item.seg.end=round2(startEnd+delta);
        (item.seg.events||[]).forEach(function(ev,i){
          ev.time=round2(Math.min(dur, Math.max(0, origEventTimes[i]+delta)));
        });
        positionSegmentBlock(el,item);
        updateSegmentEventBlocks(item.si, el);
      }
    }
    function onUp(){
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      document.removeEventListener('pointercancel',onUp);
      if(moved){
        markDirty();
        if(EDITOR.selected && EDITOR.selected.si===item.si) fillProps();
      }
    }
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
    document.addEventListener('pointercancel',onUp);
  }

  function startSegmentResize(e,item,el){
    e.preventDefault();
    e.stopPropagation();
    var startX=e.clientX;
    var startEnd=item.seg.end;
    var dur=getDuration();
    var moved=false;
    function onMove(ev){
      var dx=ev.clientX-startX;
      var ne=Math.max(item.seg.start+0.1, Math.min(dur, startEnd+dx/EDITOR.scale));
      ne=round2(ne);
      if(Math.abs(ne-item.seg.end)>0.001){
        moved=true;
        item.seg.end=ne;
        positionSegmentBlock(el,item);
      }
    }
    function onUp(){
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      document.removeEventListener('pointercancel',onUp);
      if(moved) markDirty();
    }
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
    document.addEventListener('pointercancel',onUp);
  }

  function startDrag(e,item,el){
    e.preventDefault();
    var startX=e.clientX;
    var startTime=item.ev.time;
    var dur=getDuration();
    var moved=false;
    function onMove(ev){
      var dx=ev.clientX-startX;
      var nt=Math.max(0, Math.min(dur, startTime+dx/EDITOR.scale));
      nt=round2(nt);
      if(Math.abs(nt-item.ev.time)>0.001){
        moved=true;
        item.ev.time=nt;
        positionBlock(el,item);
      }
    }
    function onUp(){
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      document.removeEventListener('pointercancel',onUp);
      select(item,el);
      if(moved) markDirty();
    }
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
    document.addEventListener('pointercancel',onUp);
  }

  function startResize(e,item,el){
    e.preventDefault();
    e.stopPropagation();
    var startX=e.clientX;
    var startDur=laneDuration(item.ev);
    var dur=getDuration();
    var moved=false;
    function onMove(ev){
      var dx=ev.clientX-startX;
      var nd=Math.max(0.1, startDur+dx/EDITOR.scale);
      nd=Math.min(nd, Math.max(0.1, dur-item.ev.time));
      nd=round2(nd);
      if(Math.abs((item.ev.time+nd)-(item.ev.end!=null?item.ev.end:(item.ev.time+laneDuration(item.ev))))>0.001){
        moved=true;
        item.ev.end=round2(item.ev.time+nd);
        delete item.ev.duration;
        positionBlock(el,item);
      }
    }
    function onUp(){
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      document.removeEventListener('pointercancel',onUp);
      select(item,el);
      if(moved) markDirty();
    }
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
    document.addEventListener('pointercancel',onUp);
  }

  function positionBlock(el,item){
    var dur=laneDuration(item.ev);
    el.style.left=(item.ev.time*EDITOR.scale)+'px';
    el.style.width=Math.max(dur*EDITOR.scale,10)+'px';
    el.title=item.ev.type+' @ '+round1(item.ev.time)+'s';
    updatePlayhead();
  }

  function select(item,el){
    EDITOR.selected={ si:item.si, ei:item.ei, ev:item.ev };
    var old=document.querySelector('.ed-block.selected');
    if(old) old.classList.remove('selected');
    if(el) el.classList.add('selected');
    // 点击事件时自动展开属性面板
    var sb=document.getElementById('editor-sidebar');
    if(sb && sb.classList.contains('collapsed')){
      sb.classList.remove('collapsed');
      var st=document.getElementById('editor-sidebar-toggle');
      if(st) st.textContent='◀';
    }
    fillProps();
  }

  function fillProps(){
    var sel=EDITOR.selected;
    var wrap=document.getElementById('editor-props');
    var empty=document.getElementById('editor-props-empty');
    if(!wrap || !empty) return;
    if(!sel){
      wrap.style.display='none';
      empty.style.display='block';
      return;
    }
    wrap.style.display='block';
    empty.style.display='none';
    document.getElementById('ed-type').value=sel.ev.type || '';
    document.getElementById('ed-time').value=round2(sel.ev.time);
    document.getElementById('ed-end').value=round2(sel.ev.time+laneDuration(sel.ev));
    document.getElementById('ed-json').value=JSON.stringify(sel.ev,null,2);
  }

  function applyTime(){
    var sel=EDITOR.selected;
    if(!sel) return;
    var v=parseFloat(document.getElementById('ed-time').value);
    if(!isNaN(v) && v>=0) sel.ev.time=round2(Math.min(v,getDuration()));
    refreshSelectedBlock();
  }

  function applyEnd(){
    var sel=EDITOR.selected;
    if(!sel) return;
    var e=parseFloat(document.getElementById('ed-end').value);
    if(!isNaN(e) && e>sel.ev.time){
      sel.ev.end=round2(e);
      delete sel.ev.duration;
    }
    refreshSelectedBlock();
  }

  function applyJson(){
    var sel=EDITOR.selected;
    if(!sel) return;
    try{
      var obj=JSON.parse(document.getElementById('ed-json').value);
      if(typeof obj!=='object' || obj===null || Array.isArray(obj)) throw new Error('必须是 JSON 对象');
      var segs=getSegments();
      var seg=segs[sel.si];
      if(!seg || !seg.events || !seg.events[sel.ei]) throw new Error('事件已不存在');
      seg.events[sel.ei]=obj;
      EDITOR.selected.ev=obj;
      render();
      var el=document.querySelector('[data-si="'+sel.si+'"][data-ei="'+sel.ei+'"]');
      if(el) select(EDITOR.selected,el);
      markDirty();
    }catch(err){ alert('JSON 错误: '+err.message); }
  }

  function refreshSelectedBlock(){
    var sel=EDITOR.selected;
    if(!sel) return;
    var el=document.querySelector('.ed-block.selected');
    if(el) positionBlock(el,{ ev:sel.ev });
    fillProps();
    markDirty();
  }

  function deleteSelected(){
    var sel=EDITOR.selected;
    if(!sel) return;
    var segs=getSegments();
    var seg=segs[sel.si];
    if(seg && seg.events) seg.events.splice(sel.ei,1);
    EDITOR.selected=null;
    render();
    fillProps();
    markDirty();
  }

  function duplicateSelected(){
    var sel=EDITOR.selected;
    if(!sel) return;
    var copy=JSON.parse(JSON.stringify(sel.ev));
    copy.time=round2((copy.time||0)+0.5);
    var seg=getSegments()[sel.si];
    if(seg && seg.events){
      seg.events.push(copy);
      render();
      markDirty();
    }
  }

  function currentTime(){
    var v=document.getElementById('source-video');
    if(v && typeof v.currentTime==='number') return v.currentTime;
    return 0;
  }

  function seekTo(t){
    if(window.__seekTo){
      window.__seekTo(t);
    } else {
      var v=document.getElementById('source-video');
      if(v && typeof v.currentTime==='number'){ try{ v.currentTime=t; }catch(e){} }
    }
    updatePlayhead();
  }

  function addEvent(type){
    if(type==='fx') type='shake'; // 视觉特效 lane 默认添加震动
    if(!CFG.segments) CFG.segments=[];
    var segs=CFG.segments;
    var t=round2(currentTime());

    if(type==='segments'){
      var dur=getDuration();
      var start=t;
      var end=Math.min(t+5, dur);
      if(end<=start){
        start=Math.max(0, t-1);
        end=Math.min(dur, start+5);
        if(end<=start) end=Math.min(dur, start+1);
      }
      segs.push({ start:round2(start), end:round2(end), fx:'low', note:'新分段', events:[] });
      render();
      markDirty();
      return;
    }

    if(!segs.length){
      alert('请先添加一个分段');
      return;
    }

    var ev={ type:type, time:t };
    // 时间统一写「开始 + 结束」（end = t + 该类型默认时长）
    var addDur = {};
    if(type==='sticker'){ addDur.d=2.0; ev.keyword='laugh'; ev.x='50%'; ev.y='50%'; }
    else if(type==='camera'){ addDur.d=3.0; ev.zoom='中'; ev.anchor='liver'; }
    else if(type==='overlay'){ addDur.d=1.5; ev.overlay_type='color'; ev.color='#ff3232'; ev.opacity=0.3; }
    else if(type==='sfx'){ addDur.d=1.0; ev.name='pop-notice'; ev.volume=0.3; }
    else if(type==='shake'){ addDur.d=0.3; ev.intensity=10; }
    else if(type==='flash'){ addDur.d=0.5; ev.color='#ffffff'; }
    else if(type==='blur'){ addDur.d=0.8; }
    else if(type==='zoom_bounce'){ addDur.d=0.3; }
    else if(type==='vignette'){ addDur.d=0.9; }
    else if(type==='hue_shift'){ addDur.d=1.0; ev.color='#ff0040'; }
    else if(type==='stutter'){ addDur.d=0.3; ev.intensity=12; }
    else if(type==='split'){ addDur.d=0.4; ev.intensity=30; }
    else if(type==='noise'){ addDur.d=1.0; }
    else if(type==='pulse'){ addDur.d=0.6; }
    else if(type==='color_shift'){ addDur.d=0.8; ev.color='#ff0040'; }
    ev.end = round2(t + (addDur.d || defaultDuration(type)));

    var target=null;
    for(var i=0;i<segs.length;i++){
      if(t>=segs[i].start && t<segs[i].end){ target=segs[i]; break; }
    }
    if(!target) target=segs[0];
    if(!target.events) target.events=[];
    target.events.push(ev);
    render();
    var si=segs.indexOf(target);
    var ei=target.events.length-1;
    var el=document.querySelector('[data-si="'+si+'"][data-ei="'+ei+'"]');
    if(el) select({ si:si, ei:ei, ev:ev }, el);
    markDirty();
  }

  function markDirty(){
    EDITOR.dirty=true;
    var st=document.getElementById('editor-status');
    if(st){
      st.textContent='有未保存修改';
      st.style.color='#fbbf24';
    }
  }

  function updatePlayhead(){
    var ph=document.getElementById('editor-playhead');
    var v=document.getElementById('source-video');
    if(ph && v && typeof v.currentTime==='number'){
      ph.style.left=(v.currentTime*EDITOR.scale)+'px';
    }
  }

  function save(){
    if(!CFG.segments){
      alert('配置中没有 segments，无法保存');
      return;
    }
    var btn=document.getElementById('editor-save');
    btn.disabled=true;
    btn.textContent='保存中...';
    fetch('/api/config',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ segments: CFG.segments })
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){ return { ok:r.ok, data:d }; });
    }).then(function(res){
      if(res.ok && res.data && res.data.ok){
        EDITOR.dirty=false;
        var st=document.getElementById('editor-status');
        if(st){ st.textContent='已保存，刷新预览...'; st.style.color='#4ade80'; }
        setTimeout(function(){
          var url=new URL(location.href);
          url.searchParams.set('editor','1');
          location.href=url.toString();
        }, 600);
      } else {
        alert('保存失败: '+((res.data && res.data.error) || '未知错误'));
        btn.disabled=false;
        btn.textContent='💾 保存到 polish.toml';
      }
    }).catch(function(err){
      alert('保存请求失败: '+err.message);
      btn.disabled=false;
      btn.textContent='💾 保存到 polish.toml';
    });
  }

  function updateEditorLayout(){
    var panel=document.getElementById('editor-panel');
    var h=panel && panel.classList.contains('open') ? panel.offsetHeight : 0;
    document.documentElement.style.setProperty('--editor-h', h+'px');
    document.body.classList.toggle('editor-open', !!(h>0));
    if(window.__updateOverlayScale) window.__updateOverlayScale();
  }

  function toggle(open){
    var panel=document.getElementById('editor-panel');
    if(!panel) return;
    if(open===undefined) open=!panel.classList.contains('open');
    panel.classList.toggle('open', open);
    updateEditorLayout();
    var btn=document.getElementById('btn-editor');
    if(btn) btn.style.color=open ? '#ff6bcb' : '';
    if(EDITOR.waitTimer){
      clearInterval(EDITOR.waitTimer);
      EDITOR.waitTimer=null;
    }
    if(open){
      render();
      var st=document.getElementById('editor-status');
      if(st){
        st.textContent=EDITOR.dirty ? '有未保存修改' : '就绪';
        st.style.color=EDITOR.dirty ? '#fbbf24' : '#9ca3af';
      }
      if(!window.__DURATION){
        var tries=0;
        EDITOR.waitTimer=setInterval(function(){
          tries++;
          if(window.__DURATION || tries>50){
            clearInterval(EDITOR.waitTimer);
            EDITOR.waitTimer=null;
            render();
          }
        },200);
      }
      if(!EDITOR.playheadTimer){
        EDITOR.playheadTimer=setInterval(updatePlayhead,200);
      }
    } else {
      if(EDITOR.waitTimer){
        clearInterval(EDITOR.waitTimer);
        EDITOR.waitTimer=null;
      }
      if(EDITOR.playheadTimer){
        clearInterval(EDITOR.playheadTimer);
        EDITOR.playheadTimer=null;
      }
    }
  }

  function bind(){
    var btn=document.getElementById('btn-editor');
    if(!btn) return;
    btn.addEventListener('click', function(){ toggle(); });
    document.getElementById('editor-close').addEventListener('click', function(){ toggle(false); });
    document.getElementById('editor-save').addEventListener('click', save);
    var sideToggle=document.getElementById('editor-sidebar-toggle');
    if(sideToggle){
      sideToggle.addEventListener('click', function(){
        var sb=document.getElementById('editor-sidebar');
        var collapsed=sb.classList.toggle('collapsed');
        sideToggle.textContent=collapsed ? '▶' : '◀';
      });
    }
    document.getElementById('ed-time').addEventListener('input', applyTime);
    document.getElementById('ed-end').addEventListener('input', applyEnd);
    document.getElementById('ed-apply-json').addEventListener('click', applyJson);
    document.getElementById('ed-delete').addEventListener('click', deleteSelected);
    document.getElementById('ed-duplicate').addEventListener('click', duplicateSelected);
    var lanesScroll=document.getElementById('editor-lanes-scroll');
    function trackTimeFromEvent(e, target){
      // 基于具体 track 的视口 rect：滚动后 rect.left 自动反映滚动，无需手动加 scrollLeft
      var rect=target.getBoundingClientRect();
      var x=e.clientX-rect.left;
      return Math.max(0, x/EDITOR.scale);
    }
    var dragSeek=false, dragTarget=null;
    lanesScroll.addEventListener('pointerdown', function(e){
      if(e.target.classList.contains('editor-lane-track')){
        dragSeek=true;
        dragTarget=e.target;
        EDITOR.selected=null;
        var old=document.querySelector('.ed-block.selected');
        if(old) old.classList.remove('selected');
        fillProps();
        seekTo(trackTimeFromEvent(e, dragTarget));
      }
    });
    lanesScroll.addEventListener('pointermove', function(e){
      if(dragSeek && dragTarget){
        seekTo(trackTimeFromEvent(e, dragTarget));
      }
    });
    window.addEventListener('pointerup', function(){ dragSeek=false; dragTarget=null; });
    lanesScroll.addEventListener('click', function(e){
      // 点击空白轨道：清空选中 + 跳转（pointerdown 已处理，这里兜底）
      if(e.target.classList.contains('editor-lane-track')){
        seekTo(trackTimeFromEvent(e, e.target));
      }
    });
    document.getElementById('editor-lanes-scroll').addEventListener('scroll', function(){
      document.getElementById('editor-ruler-scroll').scrollLeft = this.scrollLeft;
    });
    // 点击刻度尺跳转到对应时间（刻度从 0 开始；rect 已反映滚动）
    var rulerEl=document.getElementById('editor-ruler');
    if(rulerEl){
      rulerEl.addEventListener('click', function(e){
        var rect=e.currentTarget.getBoundingClientRect();
        var x=e.clientX-rect.left;
        var t=Math.max(0, x/EDITOR.scale);
        seekTo(t);
      });
    }
    // 滚轮：水平滚动时间轴视图，不移动播放时间
    document.getElementById('editor-lanes-scroll').addEventListener('wheel', function(e){
      e.preventDefault();
      var delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      this.scrollLeft += delta;
    }, { passive:false });
  }

  function init(){
    if(document.readyState==='loading'){
      document.addEventListener('DOMContentLoaded', init);
      return;
    }
    var params = new URLSearchParams(location.search);
    var isPlayerOnly = params.get('player')==='1';
    var isEmbedEditor = params.get('editor')==='1' && params.get('embed')==='1';
    if(isPlayerOnly){
      var edBtn=document.getElementById('btn-editor');
      if(edBtn) edBtn.style.display='none';
      var panel=document.getElementById('editor-panel');
      if(panel) panel.style.display='none';
      document.body.classList.add('player-only');
      window.__playerOnly=true;
      // 暴露给父页面：播放/暂停/seek/获取时间
      window.__polishPlayerControl = {
        play: function(){ if(!playing) play(); },
        pause: function(){ if(playing){ playing=false; video.pause(); if(raf) cancelAnimationFrame(raf); pb.textContent='▶'; } },
        seek: function(t){ if(isFinite(t)) window.__seekTo(t); },
        getTime: function(){ return video ? video.currentTime : 0; }
      };
      // 父页面控制播放器（postMessage）
      window.addEventListener('message', function(ev){
        var d = ev.data || {};
        if(d && d.type === 'polish-player'){
          var c = window.__polishPlayerControl;
          if(!c) return;
          if(d.cmd === 'play') c.play();
          else if(d.cmd === 'pause') c.pause();
          else if(d.cmd === 'seek') c.seek(Number(d.time) || 0);
        }
      });
      // 向父页面上报时间，供 WebUI 原生进度条
      var v = document.getElementById('source-video');
      if(v){
        v.addEventListener('timeupdate', function(){
          try{ window.parent.postMessage({ type:'polish-player-time', time:v.currentTime, duration:v.duration || 0 }, '*'); }catch(e){}
        });
        v.addEventListener('loadedmetadata', function(){
          try{ window.parent.postMessage({ type:'polish-player-time', time:v.currentTime, duration:v.duration || 0 }, '*'); }catch(e){}
        });
      }
      return;
    }
    if(isEmbedEditor){
      document.body.classList.add('editor-embed');
      window.__editorEmbed=true;
      bind();
      window.addEventListener('resize', updateEditorLayout);
      updateEditorLayout();
      toggle(true);
      return;
    }
    bind();
    window.addEventListener('resize', updateEditorLayout);
    updateEditorLayout();
    if(new URLSearchParams(location.search).get('editor')==='1'){
      toggle(true);
    }
  }
  init();
})();
</script>
</body>
</html>
