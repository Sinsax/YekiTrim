[package]
name = "vtrim-polish"
version = "0.1.0"
edition = "2024"
description = "VTuber clip polish engine (GSAP rendering + effects + assets)"
authors = ["Sinsax"]
license = "Apache-2.0"

[lib]
name = "vtrim_polish"
path = "src/lib.rs"

[features]
default = ["chrome-render"]
# wgpu 原生渲染（实验性）；chrome-render 为默认出片路径，wgpu 需显式启用
chrome-render = ["dep:headless_chrome"]
wgpu-render = ["vtrim-render-core/wgpu", "dep:wgpu", "dep:headless_chrome"]

[dependencies]
# vtrim-core (用于 .vtrim/llm.toml 路径)
vtrim-core = { path = "../vtrim-core" }
vtrim-render-core = { path = "../vtrim-render-core" }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# 异步 + LLM HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

# 错误处理
anyhow = "1"
thiserror = "2"

# AgentTask async trait
async-trait = "0.1"

# 日志
tracing = "0.1"

# Chrome CDP 控制 (渲染层, feature=chrome-render)
headless_chrome = { version = "1", optional = true }

# HTTP 服务 (为 Chrome 提供静态文件)
axum = "0.7"
tower-http = { version = "0.5", features = ["fs"] }

# wgpu 原生渲染 (feature=wgpu-render)
wgpu = { version = "27", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

# 正则
regex-lite = "0.1"

urlencoding = "2"

# 随机数
rand = "0.8"

# 日期
chrono = "0.4"

# 图片 base64 解码 (用于 Chrome 截图)
base64 = "0.22"

# GIF → PNG 帧解码 (用于 emoji 动画)
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg"] }

# 贴纸包上传：读 zip（WebUI 上传的表情包压缩包）
# default-features=false 关掉 aes-crypto/bzip2/zstd/lzma/xz/time —— 我们只读 deflate 条目。
# ⚠️ 钉 2.4.2：这个版本连同它的全部传递依赖都在本机 cargo 缓存里（4.6.1 的 deflate 走
# flate2/zlib-rs，那份没缓存，离线环境会拉不下来）。
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
