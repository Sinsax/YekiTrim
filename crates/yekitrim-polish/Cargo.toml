[package]
name = "yekitrim-polish"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "VTuber clip polish engine (GSAP rendering + effects + assets)"
authors = ["Sinsax"]
license = "Apache-2.0"

[lib]
name = "yekitrim_polish"
path = "src/lib.rs"

[features]
# ⚠️ 曾经有两条 feature，**都别再加回来**：
#   · `wgpu-render = ["yekitrim-render-core/wgpu", …]` —— wgpu 原生出片 + 单帧真渲染预览，整条已删除
#     （用户拍板：GPU 那侧交给独立的 Dhampir 底座）。
#   · `chrome-render = ["dep:headless_chrome"]` —— 本仓 headless Chrome 逐帧 canvas 出片腿，
#     2026-10-01 整条删除（用户拍板：出片只有底座一条腿，不再要求用户装浏览器）。
#     它当年是 **default**：删掉之后本 crate 的默认构建不再拉 `headless_chrome`
#     （连带那个 GPL-3.0 的 build-dependency `auto_generate_cdp` 一起消失，见 THIRD-PARTY-NOTICES）。
default = []
# **静态封面渲染**（Takumi 底座）：不跑浏览器、不跑 JS/时间，进程内出图。
# **默认关**，只影响封面这一条路：`VTEDIT_COVER_RENDERER=takumi` 且编了这个 feature 才走它；
# 没编时传 takumi 会**明确报错**（不静默回退）。
cover-takumi = ["dep:takumi"]

[dependencies]
yekitrim-llm = { path = "../yekitrim-llm" }
# yekitrim-core (用于 .yekitrim/llm.toml 路径)
yekitrim-core = { path = "../yekitrim-core" }
yekitrim-render-core = { path = "../yekitrim-render-core" }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# 异步 + LLM HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

# 错误处理
anyhow = "1"

# AgentTask async trait
async-trait = "0.1"

# 日志
tracing = "0.1"

# 静态封面渲染 (feature=cover-takumi)：吃 HTML/CSS 直接出图，不依赖浏览器。
# MIT OR Apache-2.0（与 GPL 零容忍那条不冲突）；**默认不编**，只由那个 feature 拉起来。
# ⚠️ 已知（仅当这个 feature 打开时）：链接期会冒一条
# `LNK4098: 默认库"LIBCMT"与其他库的使用冲突` —— 来自传递依赖里的 C `-sys` crate
# （takumi 的 `image-decoding` 拉进 `libwebp-sys`，它用静态 CRT）。试过
# `default-features = false` 去掉 webp：**takumi-raster 自己编不过**
# （`RenderedImage` 挂在 `image-decoding` 后面），所以只能整包默认 feature 全要。
# 默认构建（不带这个 feature）**没有**这条警告。
takumi = { version = "2.14", features = ["from-html"], optional = true }

# HTTP 服务（**预览**：`polish preview` 与 WebUI 精修页的本地预览 server，仍是 axum）
axum = "0.7"
tower-http = { version = "0.5", features = ["fs"] }

# 正则
regex-lite = "0.1"

urlencoding = "2"

# 随机数
rand = "0.8"

# 日期
chrono = "0.4"

# 图片 base64 编解码（贴纸帧 JSON、Takumi 内联资源、封面输出）
base64 = "0.22"

# GIF → PNG 帧解码 (用于 emoji 动画)
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg"] }

# 贴纸包上传：读 zip（WebUI 上传的表情包压缩包）
# default-features=false 关掉 aes-crypto/bzip2/zstd/lzma/xz/time —— 我们只读 deflate 条目。
# ⚠️ 钉 2.4.2：这个版本连同它的全部传递依赖都在本机 cargo 缓存里（4.6.1 的 deflate 走
# flate2/zlib-rs，那份没缓存，离线环境会拉不下来）。
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
