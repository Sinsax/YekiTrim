[package]
name = "yekitrim-cli"
version.workspace = true
edition = "2021"
description = "YekiTrim CLI 入口（clap 命令；服务端在 yekitrim-server crate，二进制名 yekitrim）"
authors = ["Sinsax"]
license = "Apache-2.0"

[[bin]]
name = "yekitrim"
path = "src/main.rs"

# Windows 托盘外壳（双击即后台起 server + 托盘菜单）。⚠️ 单独一个 bin 才有意义：
# `src/tray.rs` 顶上那句 `#![cfg_attr(windows, windows_subsystem = "windows")]` 是**crate 根**属性，
# 只有独立 bin 才能保证 `yekitrim.exe` 那个控制台程序不被一起变成无控制台。
[[bin]]
name = "yekitrim-tray"
path = "src/tray.rs"

[dependencies]
yekitrim-core = { path = "../yekitrim-core" }
yekitrim-polish = { path = "../yekitrim-polish" }
yekitrim-service = { path = "../yekitrim-service" }
yekitrim-server = { path = "../yekitrim-server" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"
anyhow = "1"

# 托盘用的 Win32 API。
# ⚠️ 钉 0.52：那个版本的句柄类型是 `isize`（0.59+ 改成了指针包装），托盘代码按 0.52 写的。
# 只用最小 feature 集，别开 `Win32_UI_*` 全家桶。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    # WNDCLASSW 挂在 Graphics_Gdi 后面（windows-sys 的 feature 归属就是这么分的）
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    # Job Object：把子进程放进"父死子死"的 job（托盘被强杀时不让服务变孤儿）。
    # CreateJobObjectW 还额外要 Win32_Security —— 同一个 crate 的两个 feature，不新增包。
    "Win32_System_JobObjects",
    # JOBOBJECT_EXTENDED_LIMIT_INFORMATION 的字段里有 Threading::IO_COUNTERS，所以还要它
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# ⚠️ 这里曾经是 `wgpu-render = ["yekitrim-server/wgpu-render"]` 的**转发**（feature 随 crate 走）。
# 那条 GPU 链路已删除（GPU 出片交给独立的 Dhampir 底座）。**别为了"留个口子"把它加回来** ——
# 加了不报错，只会让人以为还有 GPU 出片。
#
# 现在这里只有一条**封面**的转发：`cover-takumi`（静态封面渲染 / Takumi）。
#   · 它在 `yekitrim-polish` 里**仍是可选、默认关**：那一套依赖会拉长每次构建，Windows 上还会带出
#     libwebp-sys 的 `LNK4098` 链接器警告，发行产物的许可面也要跟着复核（见 `THIRD-PARTY-NOTICES.md`）。
#   · 但 **CLI 默认带上它** —— 这样 `cargo run --bin yekitrim server` 开箱就能在封面设计器弹窗里选 Takumi，
#     不必每次手打 `--features yekitrim-polish/cover-takumi`；而 `cargo build -p yekitrim-polish`
#     这类**库**构建依旧精简（这正是"默认关"那条理由要保住的部分）。
#   · 想临时回到精简构建：`cargo run --bin yekitrim --no-default-features server`
#     （此时封面设计器里 Takumi 那个选项会自己置灰并写明原因，见 `/api/health.cover_static`）。
cover-takumi = ["yekitrim-polish/cover-takumi"]
default = ["cover-takumi"]
