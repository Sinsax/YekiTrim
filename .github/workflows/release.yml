name: release

# 打 tag（v*）时构建并附到该 Release；也可手动触发只产出 artifact。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "附到这个已存在的 Release（留空 = 只产出 artifact）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04：sherpa 的 Linux 静态库引用 CXXABI_1.3.15（GCC 12+），22.04 链不上；
          # 它的 glibc 基线 2.39 也正好等于 xtask 的 MAX_GLIBC。
          - os: ubuntu-24.04
            target: linux
          - os: windows-latest
            target: windows

    steps:
      - uses: actions/checkout@v4

      # WebUI：dist 已入库，但 CI 里重建一遍才知道前端源码没坏
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Build WebUI
        run: |
          npm --prefix webui ci --no-audit --no-fund
          npm --prefix webui run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Windows：sherpa-onnx 的预编译库由 vendored build.rs 自己下载（sha256 钉死）。
      # Linux：build.rs 只自动下载 Windows 那份，其它平台必须显式给 SHERPA_ONNX_LIB_DIR；
      # 这里用 Sinsax/sherpa-onnx-prebuilt-no-tts 的 Linux 归档（TTS-off 版）。
      - name: Prepare sherpa-onnx libs (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          VER=$(grep -m1 '^version' vendor/sherpa-onnx-sys/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          NAME="sherpa-onnx-v${VER}-linux-x64-static-lib.tar.bz2"
          URL="https://github.com/Sinsax/sherpa-onnx-prebuilt-no-tts/releases/download/v${VER}/${NAME}"
          curl -fsSL -o /tmp/sherpa.tar.bz2 "$URL"
          mkdir -p /tmp/sherpa && tar -xjf /tmp/sherpa.tar.bz2 -C /tmp/sherpa
          LIBDIR=$(find /tmp/sherpa -maxdepth 3 -type d -name lib | head -1)
          test -n "$LIBDIR"
          ESPEAK=$(stat -c%s "$LIBDIR/libespeak-ng.a")
          echo "espeak placeholder = $ESPEAK bytes"
          test "$ESPEAK" -lt 4096   # 占位库 ~1 KB；真 espeak-ng 是 MB 级 ⇒ 直接失败
          echo "SHERPA_ONNX_LIB_DIR=$LIBDIR" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release -p yekitrim-cli --locked

      # 打包：zip（Windows）/ tar.gz（Linux）+ espeak-ng 产物门禁。
      # --no-dhampir：Dhampir 底座是独立仓，CI 里没有它的产物；本仓的包按「不带底座」出。
      # 不加 --smoke-test：CI 上起服务要占端口、Windows 上还依赖无头环境，留给本地发版验。
      - name: Package
        run: cargo xtask package --target ${{ matrix.target }} --skip-build --no-dhampir

      - uses: actions/upload-artifact@v4
        with:
          name: yekitrim-${{ matrix.target }}-x64
          path: release/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          for f in release/*; do
            gh release upload "$TAG" "$f" --clobber
          done

