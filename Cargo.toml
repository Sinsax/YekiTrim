[workspace]
members = ["crates/yekitrim-core", "crates/yekitrim-cli", "crates/yekitrim-polish",
    "crates/yekitrim-render-core", "crates/yekitrim-server", "crates/yekitrim-service", "crates/xtask"]
resolver = "2"

# 版本只有这一处来源。各 crate 写 `version.workspace = true`。
#
# 为什么必须同源：`/api/health` 的 version 来自 `CARGO_PKG_VERSION`（server crate），
# `yekitrim doctor` 的版本来自 service crate，而 `cargo xtask package` 的产物名
# `yekitrim-v<版本>-win-x64` 来自这里 —— 三处分别取各自 crate 的版本。一旦版本分叉，
# 发行包名和 exe 自报版本会悄悄对不上，而且**不会报错**。
[workspace.package]
version = "0.4.2"

# The one non-upstream crate in the build graph. It exists so that "which sherpa-onnx libs get
# linked" is decided inside cargo rather than by whoever remembers to run a wrapper script first:
# upstream's build.rs links GPL espeak-ng, prefers its own target/ cache over any archive we point
# it at, and verifies nothing -- all three silently. See vendor/sherpa-onnx-sys/FORK-NOTES.md.
#
# Dropping this section reverts to the crates.io crate, and to that silent GPL link.
[patch.crates-io]
sherpa-onnx-sys = { path = "vendor/sherpa-onnx-sys" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# ⚠️ 刻意**不**设 `panic = "abort"`。
#
# 多用户下 abort 会把"一个人的一次 panic"放大成"所有人的任务一起死"：server 是单进程，
# 渲染 / 转写 / 入库 / 下载全在同一进程里跑，任何一个 unwrap 命中都会带走整个服务
# （所有在跑的任务、所有 SSE 连接、所有正在下载的会话）。
#
# 改成 unwind 之后，`api::spawn_job` 的 `catch_unwind` 兜底才**真正生效**：任务体的 panic
# 被接住、替它调 `fail()`，Job 走到终态、资源键释放 —— 同项目/同片段的后续任务不会被饿死。
# 代价是二进制略大，以及 panic 从"响亮的进程崩溃"变成"一个任务失败"；对服务端后者才是对的。
# 回归：`yekitrim-server` 的 `api::tests::spawn_job_marks_job_failed_on_panic`。
