# V-Trim 配置文件
# 优先级: ./vtrim.toml > ~/.config/vtrim/config.toml > 环境变量

# 输入视频文件路径 (由 `vtrim init` 写入)
input_file = ""

# 弹幕文件路径 (可选，不影响流程)
danmaku_file = ""

# 转写文件路径 (由 `vtrim transcribe` 自动写入)
transcript_file = ""

# 音频文件路径 (由 `vtrim init` 自动写入)
audio_file = ""

# 事件文件路径 (由 `vtrim detect-events` 自动写入)
events_file = ""

# 人声文件路径 (由 `vtrim separate` 自动写入)
vocal_file = ""

# 当前处理进度 (0=未开始, 1~5=各阶段编号, 由程序自动管理)
current_stage = 0

[audio]
# 音频采样率 (Hz)
sample_rate = 16000
# 声道数
channels = 1

[asr]
# ASR 后端 (local / kuaishou / bcut)
backend = "local"
# 模型类型 (paraformer / sensevoice)
local_model = "sensevoice"
# 模型目录 (留空自动下载到 ~/.vtrim/)
local_model_dir = ""
# 静音分割阈值(秒): 超过此时长的静音将作为音频分段的切割边界
split_silence_secs = 10.0
# 最小片段长度(秒): 短于此长度的片段将与下一段合并
min_chunk_secs = 15.0

[asr.vad]
# Silero VAD 参数 (仅 VAD+ASR 管线使用)
threshold = 0.5              # 语音概率阈值 (越高越严格)
min_silence_duration = 0.5   # 句间最小静音(秒), 增大可减少分句
min_speech_duration = 0.25   # 最小语音段(秒)
max_speech_duration = 20.0   # 最大语音段(秒), 超过后强制分割

[detection]
# 弹幕密度统计窗口(秒)
danmaku_window_secs = 10
# 静音超过此时长(秒)即为事件边界
silence_threshold_secs = 3.0
# 最短片段(秒)
min_segment_secs = 30
# 最长片段(秒)
max_segment_secs = 900

[detection.llm]
# LLM 服务提供商
provider = "openai"
# LLM API Key (也可用 VTRIM_LLM_KEY 环境变量)
api_key = ""
# API 基础地址 (留空=OpenAI, DeepSeek="https://api.deepseek.com/v1")
api_base = ""
# 模型名称
model = "gpt-4o-mini"
# 温度参数 (越低越确定)
temperature = 0.1
# 最大 Token 数
max_tokens = 4096
# 每批处理的片段数
batch_size = 25
# 批次间重叠片段数 (用于合并连续性)
batch_overlap = 3

[cutting]
# 是否保留源编码格式 (true=流复制, false=重新编码)
preserve_source = true
# 并行剪切进程数
max_parallel = 4
# 输出目录
output_dir = "./output"
# 是否覆盖已有文件
overwrite = false
