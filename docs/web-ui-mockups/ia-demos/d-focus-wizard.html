<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 D · 单屏聚焦向导 | V-Trim 框架对比 Demo</title>
<!--
  ═══════════════════════════════════════════════════════════
  方案 D「单屏聚焦」— 交互逻辑说明（向导式）
  · 整个界面一次只呈现"现在该做的一件事"：大卡片 + 一个主按钮
  · 顶部只有一条五段进度发丝线；没有菜单、没有页签、没有侧栏
  · 任务跑完 → 打勾动画 → 自动滑入下一屏；底部小圆点可回跳
  · 精修这种多片段工作也按"一次一个片段"推进（3/5 → 4/5）
  · 取舍：零迷失、零学习成本，节奏感像流水线传送带；
    缺点是自由度最低，熟练用户会嫌点太多、无法并行多项目
  ═══════════════════════════════════════════════════════════
-->
<style>
:root{
  --bg:#FFF7F3; --bg-soft:#FFEFE7; --card:#fff; --line:#F2E1D9; --line-soft:#FAEEE7;
  --ink:#4A3F45; --ink-dim:#9C8B92; --ink-faint:#C9B8BE;
  --main:#F682B8; --main-deep:#EE6FA6; --main-soft:#FDE3EC; --pink-light:#FBB9D4; --pink-text:#D8669B;
  --blue-deep:#5E7FD8; --blue-soft:#E8EEFC;
  --amber-deep:#B97A14; --amber-soft:#FCF0D9;
  --green:#4FBF9C; --green-deep:#2FA07E; --green-soft:#DEF2EA;
  --red:#E8727E;
  --r-sm:10px; --r:16px; --r-full:999px;
  --shadow:0 8px 26px rgba(238,111,166,.10),0 2px 6px rgba(90,60,70,.04);
  --shadow-hover:0 12px 34px rgba(238,111,166,.18),0 3px 8px rgba(90,60,70,.05);
  --shadow-pink:0 4px 14px rgba(238,111,166,.4);
  --font:'LXGW WenKai','Noto Sans SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:var(--font)}
body{background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.6;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
/* ── 顶部：仅一条进度发丝线 + 极简标识 ── */
.hairline{position:fixed;top:0;left:0;right:0;display:flex;gap:4px;padding:10px 24px 0;z-index:20}
.hairline .seg{flex:1;height:4px;border-radius:var(--r-full);background:var(--bg-soft);border:1px solid var(--line-soft);transition:.4s;cursor:pointer}
.hairline .seg.done{background:var(--green);border-color:var(--green)}
.hairline .seg.cur{background:linear-gradient(90deg,var(--main),var(--main-deep));border-color:var(--main-deep);box-shadow:0 0 8px rgba(238,111,166,.5)}
.hud{position:fixed;top:26px;left:24px;z-index:20;display:flex;align-items:center;gap:10px}
.hud .logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--main),var(--pink-light));display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;box-shadow:var(--shadow-pink)}
.hud b{font-size:13px;color:var(--main-deep)}
.hud .sub{font-size:10px;color:var(--ink-faint)}
.hud-right{position:fixed;top:26px;right:24px;z-index:20;font-size:12px;color:var(--ink-dim);display:flex;gap:14px}
.hud-right span{cursor:pointer} .hud-right span:hover{color:var(--pink-text)}
/* ── 聚焦卡片 ── */
.stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:60px 24px 110px}
.focus{width:min(620px,94vw);background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-hover);padding:44px 48px;text-align:center;position:relative;overflow:hidden}
.focus.out{animation:slideout .3s forwards}
.focus.in{animation:slidein .35s}
@keyframes slideout{to{opacity:0;transform:translateY(-24px) scale(.98)}}
@keyframes slidein{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.focus .big{font-size:52px;line-height:1;margin-bottom:18px}
.focus h1{font-size:22px;color:var(--main-deep);margin-bottom:8px}
.focus p{color:var(--ink-dim);font-size:13.5px;margin-bottom:8px}
.focus .hint{font-size:11.5px;color:var(--ink-faint);margin-top:18px}
.gobtn{margin-top:22px;padding:13px 44px;border-radius:var(--r-full);background:linear-gradient(135deg,var(--main),var(--main-deep));color:#fff;font-size:15px;font-weight:700;box-shadow:0 8px 24px rgba(238,111,166,.45);transition:.15s}
.gobtn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.gobtn:disabled{opacity:.5;cursor:default;transform:none}
/* 进度环/条 */
.runbox{max-width:360px;margin:20px auto 0;display:none}
.runbox.on{display:block}
.runbox .lbl{font-size:12px;color:var(--ink-dim);margin-bottom:8px}
.bar{height:8px;border-radius:var(--r-full);background:var(--bg-soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:var(--r-full);background:linear-gradient(90deg,var(--main),var(--main-deep));transition:width .2s}
/* 完成打勾 */
.check{width:64px;height:64px;border-radius:50%;background:var(--green-soft);border:2px solid var(--green);color:var(--green-deep);font-size:30px;display:none;align-items:center;justify-content:center;margin:0 auto 18px;animation:pop .4s}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
/* 事件 chips / 缩略图条 */
.chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:16px 0 4px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 12px;border-radius:var(--r-full);font-size:11.5px;background:var(--bg-soft);color:var(--ink-dim)}
.chip.b{background:var(--blue-soft);color:var(--blue-deep)}
.chip.g{background:var(--green-soft);color:var(--green-deep)}
.chip.a{background:var(--amber-soft);color:var(--amber-deep)}
.chip.p{background:var(--main-soft);color:var(--pink-text)}
.strip{display:flex;gap:8px;justify-content:center;margin:18px 0 6px}
.strip .mini{width:74px;height:50px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:var(--shadow)}
.strip .mini:nth-child(odd){transform:rotate(-2deg)} .strip .mini:nth-child(even){transform:rotate(2deg)}
/* 精修片段切换 */
.frag-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin:16px 0 4px}
.frag-nav .fdot{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:12px;color:var(--ink-dim);cursor:pointer;transition:.15s}
.frag-nav .fdot.cur{border-color:var(--main-deep);background:var(--main-soft);color:var(--pink-text);font-weight:700}
.frag-nav .fdot.ok{border-color:var(--green);background:var(--green-soft);color:var(--green-deep)}
.frag-nav .arr{font-size:16px;color:var(--ink-dim);cursor:pointer;padding:6px}
.frag-nav .arr:hover{color:var(--pink-text)}
.tl-mock{height:38px;border-radius:10px;background:var(--bg-soft);margin:14px auto 0;max-width:420px;position:relative;overflow:hidden;border:1px solid var(--line-soft)}
.tl-mock i{position:absolute;top:6px;bottom:6px;border-radius:5px;opacity:.85}
/* 产物 */
.arts{display:flex;gap:14px;justify-content:center;margin:20px 0 4px}
.arts .a1{text-align:center}
.arts .thumb{width:110px;height:68px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;box-shadow:var(--shadow)}
/* ── 底部导航点 ── */
.dock{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:var(--r-full);padding:8px 18px;box-shadow:var(--shadow)}
.dock .d{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dock .d.done{background:var(--green)}
.dock .d.cur{background:var(--main-deep);transform:scale(1.35)}
.dock .arr{font-size:15px;color:var(--ink-dim);cursor:pointer;padding:2px 6px}
.dock .arr:hover{color:var(--pink-text)}
.dock .arr:disabled{opacity:.3;cursor:default}
.backlink{position:fixed;left:18px;bottom:22px;z-index:20;font-size:12px;color:var(--ink-dim);background:var(--card);border:1px solid var(--line);border-radius:var(--r-full);padding:5px 12px;box-shadow:var(--shadow)}
.backlink:hover{color:var(--pink-text);border-color:var(--main)}
</style>
</head>
<body>

<div class="hairline" id="hairline"></div>
<div class="hud"><div class="logo">V</div><div><b>樱花联动 4/12</b><div class="sub">方案 D · 单屏聚焦</div></div></div>
<div class="hud-right"><span onclick="toast('任务：转写进行中 42%（示意）')">🏃 任务</span><span onclick="toast('设置（示意）')">⚙️ 设置</span></div>

<div class="stage"><div class="focus" id="focus"></div></div>

<div class="dock">
  <button class="arr" id="prevArr" onclick="go(step-1)">‹</button>
  <span id="dots"></span>
  <button class="arr" id="nextArr" onclick="go(step+1)">›</button>
</div>

<a class="backlink" href="index.html">← 返回对比</a>

<script>
const STEPS=['转写','事件检测','切片','精修','渲染导出']
let step=1, frag=3, fragDone=[true,true,false,false,false], busy=false
const $=s=>document.querySelector(s)
function toast(msg){ const t=document.createElement('div'); t.textContent=msg
  t.style.cssText='position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:99;background:#4A3F45;color:#fff;padding:8px 18px;border-radius:999px;font-size:13px;transition:.25s'
  document.body.appendChild(t); setTimeout(()=>t.style.opacity=0,1600); setTimeout(()=>t.remove(),2000) }

/* ── 五屏内容 ── */
const SCREENS={
  1:()=>`<div class="big">🎙️</div><h1>先把录音变成文字</h1>
    <p>樱花联动 4/12 · 3 小时 12 分钟</p><p class="hint">使用 sensevoice 模型，预计 12 分钟，期间可以离开</p>
    <button class="gobtn" id="go1" onclick="task(this,'转写完成',()=>go(2))">开始转写</button>
    <div class="runbox"><div class="lbl" id="lb1">正在转写… 0%</div><div class="bar"><i style="width:0"></i></div></div>`,
  2:()=>`<div class="big">🔍</div><h1>找到了 7 个精彩事件</h1>
    <p>LLM 结合弹幕热度，从字幕里挑出了这些片段</p>
    <div class="chips"><span class="chip b">🎮 游戏 ×2</span><span class="chip p">🎵 音乐 ×2</span><span class="chip g">💬 互动 ×1</span><span class="chip a">🍜 美食 ×1</span><span class="chip">反应 ×1</span></div>
    <button class="gobtn" onclick="go(3)">确认，去切片</button>
    <div class="hint">也可以先去「任务」页手动微调事件列表</div>`,
  3:()=>`<div class="big">✂️</div><h1>生成 7 个切片片段</h1>
    <p>按弹幕热度排序，热门的排前面</p>
    <div class="strip"><div class="mini" style="background:linear-gradient(135deg,#F682B8,#EE6FA6)">🎤</div><div class="mini" style="background:linear-gradient(135deg,#7FA8F0,#5E7FD8)">🎮</div><div class="mini" style="background:linear-gradient(135deg,#59C0AC,#2FA07E)">💬</div><div class="mini" style="background:linear-gradient(135deg,#F2B23E,#B97A14)">🍜</div><div class="mini" style="background:linear-gradient(135deg,#D8669B,#7C3AED)">🎵</div></div>
    <button class="gobtn" onclick="task(this,'7 个切片已生成',()=>go(4))">一键全切</button>
    <div class="runbox"><div class="lbl" id="lb3">正在剪切… 0%</div><div class="bar"><i style="width:0"></i></div></div>`,
  4:()=>{
    const dots=fragDone.map((d,i)=>`<button class="fdot ${d?'ok':i+1===frag?'cur':''}" onclick="frag=${i+1};render()">${d?'✓':i+1}</button>`).join('')
    return `<div class="big">✨</div><h1>精修片段 ${frag}/5</h1>
    <p>观众点歌环节 · 字幕 / 贴纸 / 屏蔽轨道已就绪</p>
    <div class="frag-nav"><span class="arr" onclick="frag=Math.max(1,frag-1);render()">‹</span>${dots}<span class="arr" onclick="frag=Math.min(5,frag+1);render()">›</span></div>
    <div class="tl-mock"><i style="left:6%;width:20%;background:#5E7FD8"></i><i style="left:32%;width:14%;background:#5E7FD8"></i><i style="left:52%;width:18%;background:#D8669B"></i><i style="left:74%;width:16%;background:#C9B8BE"></i></div>
    <button class="gobtn" onclick="task(this,'片段 '+frag+' 已渲染',()=>{
      fragDone[frag-1]=true
      if(fragDone.every(Boolean)){ go(5) }
      else { frag=Math.min(5,frag+1); render() }
    })">渲染此片段</button>
    <div class="hint">逐段渲染，全部完成后自动进入导出</div>`
  },
  5:()=>`<div class="big">🎬</div><h1>渲染导出成片</h1>
    <p>5 个精修片段 → 成片 + 封面，进入发布队列</p>
    <button class="gobtn" onclick="task(this,'全部完成 🎉',()=>{
      document.getElementById('artrow').style.display='flex'
      const b=document.createElement('button'); b.className='gobtn'; b.textContent='重置演示'; b.onclick=()=>location.reload()
      b.style.cssText='margin-top:16px;padding:10px 30px;font-size:13px'
      document.getElementById('focus').appendChild(b)
    })">开始渲染</button>
    <div class="runbox"><div class="lbl" id="lb5">正在渲染… 0%</div><div class="bar"><i style="width:0"></i></div></div>
    <div class="arts" id="artrow" style="display:none">
      <div class="a1"><div class="thumb" style="background:linear-gradient(135deg,#7FA8F0,#5E7FD8)">🎞️</div><div class="chip g" style="margin-top:6px">成片 ×5</div></div>
      <div class="a1"><div class="thumb" style="background:linear-gradient(135deg,#F682B8,#EE6FA6)">🖼️</div><div class="chip p" style="margin-top:6px">封面 ×5</div></div>
    </div>`
}

function render(){
  const f=$('#focus')
  f.className='focus in'; f.innerHTML=SCREENS[step]()
  /* 发丝线 + 底部点 */
  $('#hairline').innerHTML=STEPS.map((s,i)=>`<div class="seg ${i+1<step?'done':i+1===step?'cur':''}" title="${s}" onclick="go(${i+1})"></div>`).join('')
  $('#dots').innerHTML=STEPS.map((s,i)=>`<span class="d ${i+1<step?'done':i+1===step?'cur':''}" title="${s}" onclick="go(${i+1})"></span>`).join('')
  $('#prevArr').disabled=step===1; $('#nextArr').disabled=step===5
}
function go(n){
  if(busy||n<1||n>5||n===step) return
  const f=$('#focus'); f.classList.add('out')
  setTimeout(()=>{ step=n; render() },280)
}
/* 通用任务动画：进度 → 打勾 → 回调推进（方案 D 的核心动线） */
function task(btn,msg,onDone){
  busy=true
  const box=btn.parentElement.querySelector('.runbox')
  btn.disabled=true
  if(!box){ /* 该屏无进度条（如逐段精修）：短暂等待后直接打勾 */
    const f=$('#focus'); f.querySelector('.gobtn')?.remove()
    f.insertAdjacentHTML('afterbegin','<div class="check" style="display:flex">✓</div>')
    const done=document.createElement('div'); done.className='hint'; done.style.marginTop='10px'; done.textContent=msg; f.appendChild(done)
    setTimeout(()=>{ busy=false; if(onDone) onDone() },900)
    return
  }
  const bar=box.querySelector('.bar>i'), lb=box.querySelector('.lbl')
  const base=lb.textContent.split('…')[0]+'… '
  box.classList.add('on')
  let p=0
  const h=setInterval(()=>{
    p=Math.min(100,p+3); bar.style.width=p+'%'; lb.textContent=base+p+'%'
    if(p>=100){
      clearInterval(h); box.classList.remove('on'); bar.style.width='0'
      const f=$('#focus')
      f.querySelector('.gobtn')?.remove()
      f.insertAdjacentHTML('afterbegin','<div class="check" style="display:flex">✓</div>')
      const done=document.createElement('div'); done.className='hint'; done.style.marginTop='10px'; done.textContent=msg; f.appendChild(done)
      setTimeout(()=>{ busy=false; if(onDone) onDone() },900)
    }
  },50)
}
render()
</script>
</body>
</html>
