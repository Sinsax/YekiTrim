<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 C · 看板 + 抽屉 | V-Trim 框架对比 Demo</title>
<!--
  ═══════════════════════════════════════════════════════════
  方案 C「状态即导航」— 交互逻辑说明（看板式）
  · 主视图就是看板：列 = 流水线阶段（待预处理/转写中/待切片/
    精修中/待发布），项目卡片按当前阶段自动落位
  · 一眼纵览所有项目的生产状态 —— "哪个项目卡在哪一步"
    不需要点任何东西就能看到
  · 点卡片 → 右侧滑出操作抽屉：在抽屉里完成该阶段的动作
    （切事件/跑任务/看进度），不发生整页跳转
  · 动作完成 → 卡片流动到下一列（本 demo 可实际触发体验）
  · 取舍：管理感、全局感最强，适合项目多、批处理场景；
    缺点是单项目深度编辑（时间轴等）仍要进入完整工作区
  ═══════════════════════════════════════════════════════════
-->
<style>
:root{
  --bg:#FFF7F3; --bg-soft:#FFEFE7; --card:#fff; --line:#F2E1D9; --line-soft:#FAEEE7;
  --ink:#4A3F45; --ink-dim:#9C8B92; --ink-faint:#C9B8BE;
  --main:#F682B8; --main-deep:#EE6FA6; --main-soft:#FDE3EC; --pink-light:#FBB9D4; --pink-text:#D8669B;
  --blue:#7FA8F0; --blue-deep:#5E7FD8; --blue-soft:#E8EEFC;
  --amber:#F2B23E; --amber-deep:#B97A14; --amber-soft:#FCF0D9;
  --green:#4FBF9C; --green-deep:#2FA07E; --green-soft:#DEF2EA;
  --red:#E8727E; --red-soft:#FBE3E5;
  --r-sm:10px; --r:16px; --r-full:999px;
  --shadow:0 8px 26px rgba(238,111,166,.10),0 2px 6px rgba(90,60,70,.04);
  --shadow-hover:0 12px 34px rgba(238,111,166,.18),0 3px 8px rgba(90,60,70,.05);
  --shadow-pink:0 4px 14px rgba(238,111,166,.4);
  --font:'LXGW WenKai','Noto Sans SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:var(--font)}
body{background:var(--bg);color:var(--ink);min-height:100vh;font-size:13px;line-height:1.6}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:var(--r-full);border:1px solid var(--line);background:var(--card);font-size:13px;transition:.15s}
.btn:hover{border-color:var(--main);color:var(--pink-text);background:var(--main-soft)}
.btn-primary{background:linear-gradient(135deg,var(--main),var(--main-deep));color:#fff;border:none;font-weight:600;box-shadow:var(--shadow-pink)}
.btn-primary:hover{filter:brightness(1.05);color:#fff}
.mini-btn{padding:4px 11px;font-size:12px;border-radius:var(--r-full);border:1px solid var(--line);background:var(--card);transition:.15s}
.mini-btn:hover{border-color:var(--main);color:var(--pink-text)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:var(--r-full);font-size:11px;background:var(--bg-soft);color:var(--ink-dim)}
.chip.g{background:var(--green-soft);color:var(--green-deep)}
.chip.b{background:var(--blue-soft);color:var(--blue-deep)}
.chip.a{background:var(--amber-soft);color:var(--amber-deep)}
.chip.p{background:var(--main-soft);color:var(--pink-text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.progress{height:6px;border-radius:var(--r-full);background:var(--bg-soft);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:var(--r-full);background:linear-gradient(90deg,var(--main),var(--main-deep));transition:width .25s}
.muted{color:var(--ink-dim)} .small{font-size:12px}
.row{display:flex;align-items:center;gap:8px} .spread{justify-content:space-between}
/* ── 顶栏 ── */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 20px;background:rgba(255,247,243,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--main),var(--pink-light));display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;box-shadow:var(--shadow-pink)}
.brand-name{font-size:14px;font-weight:700;color:var(--main-deep)}
.brand-sub{font-size:9px;color:var(--ink-faint);letter-spacing:.1em}
.nav-pills{display:flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-full);padding:4px;margin-left:16px}
.nav-pill{padding:5px 15px;border-radius:var(--r-full);font-size:13px;color:var(--ink-dim);cursor:pointer}
.nav-pill.active{background:linear-gradient(135deg,var(--main),var(--main-deep));color:#fff;font-weight:600}
.top-actions{margin-left:auto}
/* ── 看板 ── */
.board-wrap{padding:18px 20px 40px;overflow-x:auto}
.board{display:grid;grid-template-columns:repeat(5,minmax(224px,1fr));gap:12px;min-width:1180px}
.col{background:var(--bg-soft);border:1px solid var(--line-soft);border-radius:var(--r);padding:10px;min-height:380px}
.col-head{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}
.col-head b{font-size:13px}
.col-head .cnt{margin-left:auto}
.col-empty{font-size:11px;color:var(--ink-faint);text-align:center;padding:22px 0;border:1.5px dashed var(--line);border-radius:var(--r-sm)}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;margin-bottom:10px;cursor:pointer;transition:.15s}
.kcard:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.kcard .thumb{height:72px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;margin-bottom:8px}
.kcard .nm{font-weight:700;font-size:13px;line-height:1.35}
.kcard .meta{font-size:11px;color:var(--ink-faint);margin:2px 0 8px}
.kcard .progress{margin-bottom:8px}
.kcard.flash{animation:land .8s}
@keyframes land{0%{box-shadow:0 0 0 3px var(--main);transform:scale(1.04)}100%{box-shadow:var(--shadow);transform:none}}
/* ── 抽屉 ── */
.drawer-mask{position:fixed;inset:0;background:rgba(74,63,69,.28);z-index:60;opacity:0;pointer-events:none;transition:.22s}
.drawer{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:var(--card);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(90,60,70,.14);z-index:61;transition:right .26s;padding:18px;overflow-y:auto}
body.drawer-open .drawer{right:0}
body.drawer-open .drawer-mask{opacity:1;pointer-events:auto}
.dots{display:flex;gap:6px;margin:10px 0 14px}
.dots i{width:22px;height:6px;border-radius:var(--r-full);background:var(--bg-soft);border:1px solid var(--line)}
.dots i.done{background:var(--green);border-color:var(--green)}
.dots i.cur{background:var(--main);border-color:var(--main-deep)}
.dsec{border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:12px;margin-bottom:12px;background:var(--bg-soft)}
.dsec b.t{font-size:13px}
.event-row{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px dashed var(--line)}
.event-row:last-child{border-bottom:none}
.run-box{display:none;margin-top:10px}
.run-box.on{display:block}
.backlink{position:fixed;left:18px;bottom:18px;z-index:70;font-size:12px;color:var(--ink-dim);background:var(--card);border:1px solid var(--line);border-radius:var(--r-full);padding:5px 12px;box-shadow:var(--shadow)}
.backlink:hover{color:var(--pink-text);border-color:var(--main)}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:99;background:var(--ink);color:#fff;padding:8px 18px;border-radius:var(--r-full);font-size:13px;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><div class="brand-logo">V</div><div><div class="brand-name">V-TRIM</div><div class="brand-sub">方案 C · 看板</div></div></a>
  <nav class="nav-pills">
    <a class="nav-pill active">看板</a>
    <a class="nav-pill" onclick="toast('任务页（示意）：与全局任务共用')">任务</a>
    <a class="nav-pill" onclick="toast('设置页（示意）')">设置</a>
  </nav>
  <div class="top-actions"><button class="btn btn-primary">＋ 导入录像</button></div>
</header>

<div class="board-wrap"><div class="board" id="board"></div></div>

<!-- 操作抽屉：所有动作在抽屉里完成，不离开看板 -->
<div class="drawer-mask" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"></aside>

<a class="backlink" href="index.html">← 返回对比</a>
<div id="toast"></div>

<script>
/* 列 = 阶段；卡片按 col 字段落位 */
const COLS=['待预处理','转写中','待切片','精修中','待发布']
const CARDS=[
  {id:'p4',name:'联动回 4/16',col:0,icon:'📼',grad:'linear-gradient(135deg,#9C8B92,#6b5a63)',meta:'3h 05m · 弹幕 ✓',
   act:{label:'开始转写',to:1},
   drawer:`<div class="dsec"><b class="t">🎙️ 预处理</b><p class="small muted" style="margin:6px 0 10px">sensevoice · 约 15 分钟 · 转写后自动进入事件检测</p>
     <button class="btn btn-primary" onclick="runFlow(this,'p4',1,'转写已启动','转写中 · sensevoice')">开始转写</button><div class="run-box progress"><i style="width:0"></i></div></div>`},
  {id:'p3',name:'歌回 4/15',col:1,icon:'🎧',grad:'linear-gradient(135deg,#7FA8F0,#5E7FD8)',meta:'1h 58m · sensevoice',running:42,
   act:{label:'查看进度',to:null},
   drawer:`<div class="dsec"><b class="t">🏃 转写进行中</b><div class="progress" style="margin:10px 0 6px"><i style="width:42%"></i></div>
     <div class="row spread small muted"><span>chunk 25/60</span><span>剩余约 7 分钟</span></div>
     <div style="margin-top:12px"><button class="mini-btn" onclick="toast('已取消')">取消任务</button></div></div>`},
  {id:'p2',name:'杂谈回 4/15',col:2,icon:'💬',grad:'linear-gradient(135deg,#59C0AC,#2FA07E)',meta:'2h 47m · 7 个事件',
   act:{label:'去切片',to:3},
   drawer:`<div class="dsec"><b class="t">✂ 待切片 · 7 个事件</b>
     <div class="event-row"><span class="chip b">游戏</span><span class="small" style="flex:1">开场翻车</span><span class="small muted">03:12</span></div>
     <div class="event-row"><span class="chip p">音乐</span><span class="small" style="flex:1">即兴弹唱</span><span class="small muted">41:20</span></div>
     <div class="event-row"><span class="chip g">问答</span><span class="small" style="flex:1">杂谈环节</span><span class="small muted">62:44</span></div>
     <div class="small muted" style="text-align:center;padding:4px 0">+4 更多</div>
     <div class="row" style="margin-top:10px"><button class="btn btn-primary" style="flex:1;justify-content:center" onclick="runFlow(this,'p2',3,'7 个事件已加入剪切队列','7 个切片 · 待精修')">✂ 一键全切</button></div>
     <div class="run-box progress"><i style="width:0"></i></div></div>`},
  {id:'p1',name:'樱花联动 4/12 双人联动回',col:3,icon:'🌸',grad:'linear-gradient(135deg,#F682B8,#EE6FA6)',meta:'3h 12m · 精修 3/5',
   act:{label:'继续精修',to:null},
   drawer:`<div class="dsec"><b class="t">✨ 精修 · 片段 3/5</b><p class="small muted" style="margin:6px 0">观众点歌环节 · 时间轴/贴纸/封面已生成</p>
     <div class="row"><button class="btn" style="flex:1;justify-content:center" onclick="toast('将进入完整精修工作区')">打开编辑器</button>
     <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="runFlow(this,'p1',4,'渲染完成，已进入待发布','5 个成片 · 封面就绪')">🎬 渲染导出</button></div>
     <div class="run-box progress"><i style="width:0"></i></div></div>`},
  {id:'p0',name:'游戏回 4/10',col:4,icon:'🎞️',grad:'linear-gradient(135deg,#4FBF9C,#2FA07E)',meta:'4 个成片 · 封面就绪',
   act:{label:'查看产物',to:null},
   drawer:`<div class="dsec"><b class="t">✅ 已完成</b><div class="row" style="gap:10px;margin-top:10px">
     <div style="flex:1;text-align:center"><div class="thumb" style="height:56px;border-radius:10px;background:linear-gradient(135deg,#7FA8F0,#5E7FD8);font-size:18px">🎞️</div><div class="small muted">成片 ×4</div></div>
     <div style="flex:1;text-align:center"><div class="thumb" style="height:56px;border-radius:10px;background:linear-gradient(135deg,#F682B8,#EE6FA6);font-size:18px">🖼️</div><div class="small muted">封面 ×4</div></div></div>
     <button class="btn" style="width:100%;justify-content:center;margin-top:12px" onclick="toast('publish_config.json 已就绪，可发布')">复制发布信息</button></div>`}
]
const $=s=>document.querySelector(s)
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800) }

function renderBoard(){
  $('#board').innerHTML = COLS.map((c,i)=>{
    const cards=CARDS.filter(k=>k.col===i).map(k=>`
      <div class="kcard" data-id="${k.id}" onclick="openDrawer('${k.id}')">
        <div class="thumb" style="background:${k.grad}">${k.icon}</div>
        <div class="nm">${k.name}</div>
        <div class="meta">${k.meta}</div>
        ${k.running!=null?`<div class="progress"><i style="width:${k.running}%"></i></div>`:''}
        <button class="btn ${k.to!=null?'btn-primary':''}" style="width:100%;justify-content:center;margin-top:8px" onclick="event.stopPropagation();${k.to!=null?`openDrawer('${k.id}')`:`toast('查看产物（示意）')`}">${k.act.label}</button>
      </div>`).join('')
    return `<div class="col" data-col="${i}">
      <div class="col-head"><b>${c}</b><span class="chip cnt">${CARDS.filter(k=>k.col===i).length}</span></div>
      ${cards||'<div class="col-empty">暂无项目</div>'}
    </div>`
  }).join('')
}
function openDrawer(id){
  const k=CARDS.find(c=>c.id===id)
  $('#drawer').innerHTML=`
    <div class="row spread"><b style="font-size:15px;color:var(--main-deep)">${k.name}</b><button class="mini-btn" onclick="closeDrawer()">✕</button></div>
    <div class="dots">${COLS.map((_,i)=>`<i class="${i<k.col?'done':i===k.col?'cur':''}"></i>`).join('')}</div>
    <div class="small muted" style="margin-bottom:12px">当前阶段：${COLS[k.col]} · ${k.meta}</div>
    ${k.drawer}`
  document.body.classList.add('drawer-open')
}
function closeDrawer(){ document.body.classList.remove('drawer-open') }
/* 动作完成 → 卡片流动到 to 列（方案 C 的核心动线） */
function runFlow(btn,id,to,msg,newMeta){
  const box=btn.closest('.dsec').querySelector('.run-box')
  if(!box||to==null){ toast(msg); return }
  const k=CARDS.find(c=>c.id===id)
  box.classList.add('on'); const bar=box.querySelector('i'); btn.disabled=true; btn.style.opacity=.5
  let p=0; const h=setInterval(()=>{ p=Math.min(100,p+5); bar.style.width=p+'%'
    if(p>=100){ clearInterval(h); toast(msg)
      closeDrawer()
      k.col=to; if(newMeta) k.meta=newMeta
      renderBoard()
      const el=document.querySelector(`.kcard[data-id="${id}"]`); if(el) el.classList.add('flash')
    }},70)
}
renderBoard()
</script>
</body>
</html>
